<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoVex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            blue: {
              DEFAULT: '#0B6DFF',
              50:  '#EEF6FA',
              100: '#D7EDFF',
              200: '#B9E0FF',
              300: '#88CFFF',
              400: '#50B2FF',
              500: '#2890FF',
              600: '#0B6DFF',
              700: '#0A59EB',
              800: '#0F47BE',
              900: '#134195',
              950: '#11285A',
            },
            'av-blue':      '#0B6DFF',
            'av-blue-dark': '#0050C8',
            'av-dark':      '#08234D',
            'av-turquoise': '#00F0DC',
            'av-sky':       '#DAF0F5',
            'av-peach':     '#F5AB84',
            'av-cream':     '#FAEADA',
          },
          fontFamily: {
            display: ['Barlow', 'ui-sans-serif', 'system-ui', 'sans-serif', '"Apple Color Emoji"', '"Segoe UI Emoji"', '"Segoe UI Symbol"', '"Noto Color Emoji"'],
            body:    ['"DM Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif', '"Apple Color Emoji"', '"Segoe UI Emoji"', '"Segoe UI Symbol"', '"Noto Color Emoji"'],
            barlow:  ['Barlow', 'sans-serif'],
            dm:      ['"DM Sans"', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script src="tw-tokens.js"></script>
  <script src="translations.js"></script>
  <script src="i18n.js"></script>
  <script src="proto-mode.js"></script>
  <script src="proto-mock.js"></script>
  <script>
    /* The spec page shows each version in an iframe; ?embed=1 drops the
       prototype's own chrome there. */
    if (new URLSearchParams(location.search).get('embed') === '1') document.documentElement.setAttribute('data-embed', '');
  </script>
  <style>
    html[data-embed] #proto-bar, html[data-embed] #rl-inbox { display: none !important; }
    html[data-embed] body.proto-bar-on { padding-bottom: 0; }
    /* Message.vue's error type, as login.html transcribes it. */
    .av-msg--error { background-color: rgb(239 68 68 / .1); border-color: #EF4444; }
    .av-msg--error .av-msg-icon { color: #EF4444; }
    /* Prod's Notification.vue, theme important_warning. The card is filled by
       script, so its colours are written here rather than left to the Play
       CDN, which would paint them a tick late. */
    .rl-card { background-color: #FFEDD5; border-color: #FDBA74; }
    #rl-inbox { position: fixed; bottom: 24px; right: 24px; z-index: 8000; width: 320px; max-width: calc(100vw - 32px); background: rgba(255,255,255,.97); border-radius: 16px; box-shadow: 0 16px 56px rgba(0,0,0,.20), 0 4px 16px rgba(0,0,0,.10), 0 0 0 1.5px rgba(11,109,255,.12); padding: 14px 14px 14px 16px; display: none; flex-direction: column; gap: 6px; font-family: 'DM Sans', sans-serif; }
    #rl-inbox.is-on { display: flex; }
    body:has(#proto-bar) #rl-inbox { bottom: 54px; }
  </style>
</head>
<body class="bg-white font-body text-black">

  <!-- Prod's OFullscreenLoading shell, as Huutokaupat routing v6 uses it: a
       white page, the logo on top, the message centred on the viewport. -->
  <div class="min-h-screen flex flex-col items-center relative">
    <div class="absolute top-0 inset-x-0 flex justify-center p-4">
      <a href="index.html" data-i18n-aria="success.backToHome" aria-label="Takaisin etusivulle" class="block">
        <img src="assets/logo-fi.svg" width="108" height="22" alt="AutoVex" class="inline-block pointer-events-none" />
      </a>
    </div>
    <main class="flex-1 flex items-center justify-center w-full px-5 py-16">
      <div class="flex flex-col gap-6 w-full max-w-md text-left">
        <div id="rl-card" class="rl-card p-6 flex flex-col space-y-4 rounded-xl border-2 overflow-auto font-dm"></div>
        <div class="flex flex-col gap-4">
          <h1 id="rl-title" tabindex="-1"
              class="m-0 font-barlow font-bold text-slate-900 text-3xl leading-[36px] lg:text-5xl lg:leading-[48px] outline-none"></h1>
          <div id="rl-body" class="flex flex-col gap-3 font-dm text-base text-slate-600"></div>
        </div>
        <div id="rl-msg"></div>
        <div class="flex flex-col items-center gap-5">
          <a id="rl-primary" href="#"
             class="w-full inline-flex justify-center items-center transition rounded-lg px-8 h-14 text-base leading-tight bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white shadow-[inset_0px_1px_2px_1px_rgba(255,255,255,0.20)] no-underline"></a>
          <button id="rl-resend" type="button"
                  class="hidden w-full inline-flex justify-center items-center transition rounded-lg px-8 h-14 text-base leading-tight bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white shadow-[inset_0px_1px_2px_1px_rgba(255,255,255,0.20)] border-0 cursor-pointer"></button>
          <button id="rl-resend-again" type="button"
                  class="hidden self-center bg-transparent border-none p-0 cursor-pointer font-dm font-medium text-base leading-5 text-av-blue hover:underline"></button>
          <!-- Huutokaupat routing v6's back link, unchanged. -->
          <a id="rl-back" href="index.html"
             class="self-center inline-flex items-center gap-2 font-dm font-medium text-base leading-5 text-av-blue hover:underline no-underline"
             ><svg class="w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 17 17" fill="currentColor" aria-hidden="true"><path d="M15.1406 8.49999C15.1406 8.71133 15.0567 8.91402 14.9072 9.06346C14.7578 9.2129 14.5551 9.29686 14.3438 9.29686H4.58205L8.0033 12.7174C8.153 12.8671 8.2371 13.0702 8.2371 13.2819C8.2371 13.4936 8.153 13.6967 8.0033 13.8464C7.8536 13.9961 7.65056 14.0802 7.43885 14.0802C7.22713 14.0802 7.0241 13.9961 6.87439 13.8464L2.09314 9.0651C2.01885 8.99107 1.95991 8.9031 1.91969 8.80624C1.87947 8.70938 1.85876 8.60553 1.85876 8.50065C1.85876 8.39577 1.87947 8.29192 1.91969 8.19506C1.95991 8.0982 2.01885 8.01023 2.09314 7.9362L6.87439 3.15495C6.94852 3.08082 7.03652 3.02202 7.13337 2.98191C7.23022 2.94179 7.33402 2.92114 7.43885 2.92114C7.54367 2.92114 7.64748 2.94179 7.74433 2.98191C7.84118 3.02202 7.92917 3.08082 8.0033 3.15495C8.07742 3.22907 8.13622 3.31707 8.17634 3.41392C8.21646 3.51077 8.2371 3.61457 8.2371 3.7194C8.2371 3.82423 8.21646 3.92803 8.17634 4.02488C8.13622 4.12173 8.07742 4.20973 8.0033 4.28385L4.58205 7.70311H14.3438C14.5551 7.70311 14.7578 7.78707 14.9072 7.93651C15.0567 8.08595 15.1406 8.28864 15.1406 8.49999Z"/></svg><span data-i18n="huutokaupat.back">Takaisin etusivulle</span></a>
        </div>
        <p id="rl-help" class="m-0 font-dm text-sm text-slate-600"></p>
      </div>
    </main>
  </div>

  <!-- The verification email, standing in for the seller's inbox after a
       resend. Shown in test mode too, since the flow continues through it. -->
  <div id="rl-inbox" role="dialog" aria-labelledby="rl-inbox-title">
    <div class="flex items-center gap-2">
      <span class="flex items-center justify-center w-8 h-8 rounded-lg bg-av-blue flex-shrink-0"><svg width="16" height="13" viewBox="0 0 16 13" fill="none" aria-hidden="true"><rect x="0.75" y="0.75" width="14.5" height="11.5" rx="2.25" stroke="white" stroke-width="1.5"/><path d="M1 2.5l7 4.5 7-4.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg></span>
      <span class="flex-1 text-[13px] font-bold text-slate-950">AutoVex</span>
      <span class="text-xs text-slate-400" data-i18n="success.emailToastNow">nyt</span>
    </div>
    <p id="rl-inbox-title" class="m-0 text-sm font-bold text-slate-900" data-i18n="success.emailToastTitle">Sinulla on 1 uusi sähköposti</p>
    <p id="rl-inbox-subject" class="m-0 text-sm text-slate-600"></p>
    <a id="rl-inbox-open" href="success.html?emailVerified=1"
       class="self-start mt-2 h-8 px-3.5 inline-flex items-center rounded-lg bg-av-blue text-white text-sm no-underline hover:bg-[#0A59EB]"></a>
  </div>

  <script src="vehicle-card.js"></script>
  <script>
  (function () {
    function el(id) { return document.getElementById(id); }
    function T(k) { return window.t ? window.t('refusedLink.' + k) : k; }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    /* Three versions cover every refused link, chosen by the ad, not by why
       the link failed: the ad has an account (log in), the ad can still be
       continued without one (new confirmation email), or the ad is gone (new
       ad). `car` is whether the server still has the ad to show; the email
       change link is about the profile, not a car. */
    var SCENARIOS = {
      'login':        { ver: 'login',  car: true },
      'email-change': { ver: 'login',  car: false, emailChange: true },
      'resend':       { ver: 'resend', car: true },
      'resend-sent':  { ver: 'resend', car: true, sends: 1 },
      'resend-limit': { ver: 'resend', car: true, sends: 3, limited: true },
      'new-ad':       { ver: 'newAd',  car: true }
    };
    var DEFAULT_SCENARIO = 'resend';

    /* The open draft-verification-burst change caps sends at three per ad in
       ten minutes. */
    var RESEND_LIMIT = 3;

    var params = new URLSearchParams(location.search);
    var id = SCENARIOS[params.get('scenario')] ? params.get('scenario') : DEFAULT_SCENARIO;
    var sc = SCENARIOS[id];
    var carOn = params.get('car') !== 'hide';
    var sendOn = params.get('send') !== '0';
    var sends = sc.sends || 0;
    var sent = sends > 0 && !sc.limited;
    var limited = !!sc.limited;

    function store() { try { return JSON.parse(localStorage.getItem('autovex_funnel') || '{}') || {}; } catch (e) { return {}; } }

    /* The address on the ad, masked the way Jaakko proposed (ja****@au****):
       the first two letters of the name and of the domain. The page is open
       to anyone holding the link, so the full address never shows. */
    function maskedEmail() {
      var s = store();
      var address = s.draftEmail || (s.contact && s.contact.sahkoposti) || 'matti.meikalainen@example.fi';
      var at = address.indexOf('@');
      if (at < 1) return '****';
      return address.slice(0, Math.min(2, at)) + '****@' + address.slice(at + 1, at + 3) + '****';
    }

    function kmLabel(raw) {
      var n = parseInt(String(raw || '').replace(/\D/g, ''), 10);
      return isNaN(n) ? '' : n.toLocaleString('fi-FI') + ' km';
    }

    /* Huutokaupat routing v6's notice row: the plate where the notification
       draws its icon, the mileage on the right. important_warning gives the
       plate a white face with no border; the mileage is UiBadge `light`,
       with no icon, since nothing about it is wrong here. */
    function carRow() {
      if (!sc.car || !carOn) return '';
      var hero = store().hero || {};
      var km = kmLabel(hero.km || '148 000');
      return '<div class="flex justify-between items-center gap-2">' +
          window.buildRegBadge(hero.plate || 'LRX-345', { plateClass: 'bg-white border-none' }) +
          (km ? '<div class="av-card__badge inline-flex items-center px-2 py-1 font-dm rounded border bg-slate-50 border-slate-200 text-slate-500 whitespace-nowrap">' + esc(km) + '</div>' : '') +
        '</div>';
    }

    function renderCard() {
      var ad = sc.ver === 'newAd';
      el('rl-card').innerHTML =
        carRow() +
        '<div class="flex flex-col space-y-2.5">' +
          '<span class="text-xl text-slate-800 font-bold">' + esc(T(ad ? 'noticeAdTitle' : 'noticeLinkTitle')) + '</span>' +
          '<span class="text-slate-600">' + esc(T(ad ? 'noticeAdText' : 'noticeLinkText')) + '</span>' +
        '</div>';
    }

    var WARN = '<svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm-8-80V80a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,172Z"/></svg>';

    function setLink(node, key, href) {
      node.textContent = T(key);
      node.setAttribute('href', href);
      node.classList.remove('hidden');
    }

    function render() {
      renderCard();

      var primary = el('rl-primary'), resend = el('rl-resend'), again = el('rl-resend-again'), back = el('rl-back');
      [primary, resend, again].forEach(function (n) { n.classList.add('hidden'); });
      back.classList.remove('hidden');
      var title, body;

      if (sc.ver === 'login') {
        title = 'loginTitle';
        body = sc.emailChange ? ['emailUnchanged', 'emailChangeBody'] : ['adSafe', 'loginBody'];
        setLink(primary, 'loginCta', 'login.html');
      } else if (sc.ver === 'resend' && !sendOn) {
        title = 'resendTitle';
        body = ['adSafe', 'fromAdBody'];
        setLink(primary, 'fromAdCta', 'index.html');
        back.classList.add('hidden');
      } else if (sc.ver === 'resend' && sent) {
        title = 'sentTitle';
        body = ['sentBody', 'sentSpam'];
        again.textContent = T('resendCta');
        again.classList.remove('hidden');
      } else if (sc.ver === 'resend') {
        title = 'resendTitle';
        body = ['adSafe', 'resendBody'];
        resend.textContent = T('resendCta');
        resend.classList.remove('hidden');
      } else {
        title = 'newAdTitle';
        body = ['newAdBody'];
        setLink(primary, 'newAdCta', 'index.html');
        back.classList.add('hidden');
      }

      var showLimit = limited && sendOn && sc.ver === 'resend';
      el('rl-msg').classList.toggle('hidden', !showLimit);
      el('rl-msg').innerHTML = showLimit
        ? '<div class="av-msg av-msg--error flex items-start p-2 rounded-md border font-dm text-base" role="alert">' +
            '<div class="mr-1 w-6 h-6 flex items-center"><i class="av-msg-icon flex items-center">' + WARN + '</i></div>' +
            '<div>' + esc(T('tooMany')) + '</div>' +
          '</div>'
        : '';

      el('rl-title').textContent = T(title);
      document.title = T(title) + ' – AutoVex';
      el('rl-body').innerHTML = body.map(function (k) {
        return '<p class="m-0">' + esc(T(k)).replace('{email}', '<strong>' + esc(maskedEmail()) + '</strong>') + '</p>';
      }).join('');
      el('rl-help').innerHTML = esc(T('help')).replace('{link}',
        '<a class="text-slate-600 underline" href="help.html">' + esc(T('helpLink')) + '</a>');

      el('rl-inbox-subject').textContent = T('inboxSubject');
      el('rl-inbox-open').textContent = T('inboxOpen');
    }

    var inboxTimer;
    function showInbox() {
      clearTimeout(inboxTimer);
      el('rl-inbox').classList.remove('is-on');
      inboxTimer = setTimeout(function () { el('rl-inbox').classList.add('is-on'); }, 1500);
    }

    function setScenario(next) {
      id = next;
      var p = new URLSearchParams(location.search);
      p.set('scenario', next);
      history.replaceState(null, '', location.pathname + '?' + p.toString());
    }

    function send() {
      if (sends >= RESEND_LIMIT) {
        limited = true;
        sent = false;
        setScenario('resend-limit');
        render();
        return;
      }
      sends += 1;
      sent = true;
      limited = false;
      setScenario('resend-sent');
      render();
      el('rl-title').focus();
      showInbox();
    }

    el('rl-resend').addEventListener('click', send);
    el('rl-resend-again').addEventListener('click', send);
    document.addEventListener('av:langchange', render);
    document.addEventListener('DOMContentLoaded', render);
    render();

    function withParam(name, value) {
      return function () {
        var p = new URLSearchParams(location.search);
        if (value == null) p.delete(name); else p.set(name, value);
        p.set('scenario', id);
        location.href = location.pathname + '?' + p.toString();
      };
    }

    window.protoPage = {
      scenarios: [
        { group: 'Log in to continue · the ad has an account', items: [
          { id: 'login',        label: 'Any refused link to an ad with an account' },
          { id: 'email-change', label: 'Profile email-change link' }
        ] },
        { group: 'New confirmation email · no account yet', items: [
          { id: 'resend',       label: 'Any refused link to an open ad' },
          { id: 'resend-sent',  label: 'After sending' },
          { id: 'resend-limit', label: 'Too many sends' }
        ] },
        { group: 'New ad · the ad is gone', items: [
          { id: 'new-ad',       label: 'Ad expired, deleted or not found' }
        ] }
      ],
      scenarioCurrent: function () { return id; },
      initiatives: [ {
        slug: 'refused-link',
        default: 'v1',
        variants: [ { id: 'v1', label: 'v1 — refused-link page' } ]
      } ],
      actionSections: [
        { label: 'Plate and mileage (Jaakko’s call)', actions: [
          { label: 'Show', title: 'Wherever the server still has the ad', run: withParam('car', null) },
          { label: 'Hide', title: 'The notice without the car row', run: withParam('car', 'hide') }
        ] },
        { label: 'New confirmation email', actions: [
          { label: 'Send button on this page', title: 'Design’s proposal: the page sends it', run: withParam('send', null) },
          { label: 'No send button', title: 'The seller asks for it from the ad, on the device they filled it in on', run: withParam('send', '0') }
        ] }
      ]
    };
  })();
  </script>
  <script src="proto-bar.js"></script>
</body>
</html>
