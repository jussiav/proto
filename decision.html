  <style>
    /* NumberInput.vue's own <style> — the suffix (€) is drawn by the wrapper
       inside the field, not placed in the label. Verbatim from prod. */
    [data-suffix] { position: relative; }
    [data-suffix]::after {
      content: attr(data-suffix);
      position: absolute;
      top: 0;
      bottom: 0;
      right: 1em;
      display: flex;
      align-items: center;
    }

    /* DeliveryDateModal.vue's help block: `text-sm text-slate-600 bg-[#FAEADA]
       border border-[#FAEADA] p-4 rounded-md`, plus its list. Hand-written for
       the usual reason — the Play CDN only generates utilities present at first
       paint, and every class in this modal is injected by JS, so the arbitrary
       `bg-[#FAEADA]` produced no rule at all. Values are prod's, verbatim. */
    .modal-help {
      font-size: .875rem;
      line-height: 1.25rem;
      color: #475569;            /* slate-600 */
      background: #FAEADA;
      border: 1px solid #FAEADA;
      padding: 1rem;             /* p-4 */
      border-radius: .375rem;    /* rounded-md */
    }
    /* Change 18: the block is the tallest thing above the thread, and on a phone
       every 8px of padding is a line of conversation pushed under the fold. */
    @media (max-width: 620px) { .modal-help { padding: .75rem; } }
    .modal-help ul { list-style: disc outside; padding-left: 1rem; margin: 0; }
    .modal-help li + li { margin-top: .25rem; }

    /* NegotiationMessage.vue's `max-h-[325px] overflow-y-auto`. The utility
       classes stay on the element for the record, but the cap is duplicated here
       because the Play CDN generates JIT classes ASYNCHRONOUSLY when JS injects
       them: on the first open the rule arrived after the render, so the list was
       briefly uncapped and the scroll-to-bottom had nothing to scroll. */
    .neg-thread { max-height: 325px; overflow-y: auto; }

    /* partials/Negotiation.vue's .speech-bubble tail. Hand-written because the
       Play CDN generates no utilities for a ::before, and the SCSS is scoped in
       prod. Colours are prod's `bg-blue` (= blue-600, #0B6DFF) and the #E1E7F0
       border literal the component itself uses. */
    .speech-bubble { position: relative; }
    .speech-bubble::before {
      content: "";
      height: .5rem;
      width: .5rem;
      display: block;
      position: absolute;
      bottom: .5rem;
      transform: rotate(45deg);
    }
    .speech-bubble--left::before {
      background: #fff;
      left: -.25rem;
      border-left: 1px solid #E1E7F0;
      border-bottom: 1px solid #E1E7F0;
    }
    .speech-bubble--right::before {
      background: #0B6DFF;
      right: -.25rem;
    }
  </style>

  <script>
  (function() {
    var _now = function() { return Math.floor(Date.now() / 1000); };
    var REACTION = 7200;
    var _params  = new URLSearchParams(window.location.search);

    /* ── "Enhanced negotiations" arm ──────────────────────────────────────────
       Read through protoVariant so it behaves like every other initiative:
       remembered across pages, working in test mode. Unrecognised values are
       forgotten rather than left in storage, which would leave the bar's row on
       "— none —" while the page rendered something else.

       Batch 1: the copy-only changes — standing offer by the field, the
       offer-can-only-rise fact, the binding statement, the 24-hour deadline, the
       last-round wording.
       Batch 2: change 4 — the thread rendered as `NegotiationMessage.vue` does
       it, with accept inside the dealership's last message, the history reveal on
       a stopped negotiation, and the rounds count moved onto the send button the
       way the dealership's own form does it.
       Batch 3: change 7, findability.
       Spec: design-specs/enhanced-negotiations.html */
    var EN_ARMS = ['control', 'v1'];
    var EN_ARM = (function () {
      var arm = window.protoVariant('enhanced-negotiations', 'control');
      if (EN_ARMS.indexOf(arm) === -1) { window.protoVariantSet('enhanced-negotiations', null); return 'control'; }
      return arm;
    }());
    var EN_V1 = EN_ARM === 'v1';

    /* Change 17. The accept colour, in one place because it appears on the card,
       in the modal footer and inside the dealership's last bubble, and the three
       have to agree.

       `green-500` — the brand green. prod's own accept is `green-600`, half a
       step darker; 500 is the lighter, cleaner green and it sits better beside
       the card's blues. The front page hero's brand teal was tried as its own arm
       and dropped: it is the marketing accent, it carries no yes/confirm meaning
       of its own, and beside the amber reply signal it competed rather than
       layered. */
    function acceptCls() {
      return 'bg-green-500 hover:bg-green-600 text-white shadow-[inset_0px_1px_2px_1px_rgba(255,255,255,0.20)]';
    }

    /* All FI copy below is a DRAFT PENDING APPROVAL — prod has none of it, since
       the feature does not exist there. Kept inline rather than in
       translations.js because this page has no data-i18n at all and hardcodes
       its Finnish; adding one arm's strings to the corpus would make this the
       only translated copy on the page. */
    var EN_COPY = {
      /* Change 1 — the field's reference figure. Label is prod's own
         offer_card.first_place, so only the layout is new here. */
      standingOfferLabel: 'Korkein tarjous',

      /* Changes 2 and 3, now ONE sentence pair. It states all three outcomes of a
         counter offer in the order they matter: accepted and the sale closes
         (change 3 — an accepted counter offer runs the same accept action the
         seller's own does), raised, or held (change 2 — a reply is validated
         against the standing amount and a close preserves it). The separate
         binding bullet went with it; it now says the same thing twice. */
      counterOutcomes: 'Autoliike voi hyväksyä vastatarjouksesi, jolloin kaupat syntyvät. Se voi myös nostaa tai pitäytyä tarjouksessaan.',

      /* The waiting state's second line. It used to be change 5's deadline —
         24 hours of business time, then the auto-close — and now answers a
         different question: the standing offer is still yours while you wait, so
         waiting costs nothing. See the spec: change 5 no longer has copy of its
         own in the modal. */
      acceptAnyTime: 'Voit hyväksyä tarjouksen myös neuvottelujen aikana.',

      /* Prod's own reply-time line (negotiation_round_one.first_list_item), which
         spends most of its length on hedging. The hours are the fact. */
      replyHours: 'Liikkeet vastaavat arkisin klo 10–16.',

      /* Change 18 — prod's contact_info_not_allowed is a full sentence on its own
         paragraph under the textarea. As the label row's hint it has to fit
         beside "Viesti" at 360px, so it states the rule and nothing else. */
      noContactInfo: 'Älä jätä yhteystietoja',

      /* Closed state. The title says the negotiation ended, so the help line does
         not repeat it — it answers what happens next instead, which control never
         states anywhere. The decision page's own hero body was used here first
         and read as a second announcement of the same fact. */
      stoppedHelp: 'Hyväksyttyäsi tarjouksen, autoliike ottaa sinuun yhteyttä.'

      /* Change 6 needs no string of its own: batch 2 replaced batch 1's hint
         line with prod's rounds-carrying send button
         (tender.button.deal.reply_to_negotiation), built in the footer. */
    };

    // ── Persistent state (localStorage) ──
    var _STATE_KEY = 'autovex_decision';
    function _loadState() { try { return JSON.parse(localStorage.getItem(_STATE_KEY) || 'null') || {}; } catch(e) { return {}; } }
    function saveState() {
      try {
        localStorage.setItem(_STATE_KEY, JSON.stringify({ scenario: SCENARIO, negotiations: NEGOTIATIONS, acceptedOffer: ACCEPTED_OFFER, acceptedOffersSnapshot: ACCEPTED_OFFERS_SNAPSHOT }));
        var _existingOffers = (function() { try { return JSON.parse(localStorage.getItem('autovex_offers') || '{}'); } catch(e) { return {}; } })();
        localStorage.setItem('autovex_offers', JSON.stringify(Object.assign({}, _existingOffers, { scenario: SCENARIO })));
      } catch(e) {}
    }
    var _savedState = _loadState();

    var SCENARIO = _params.get('scenario') || _savedState.scenario || 'new-offers';
    // All decision scenarios are post-auction — ensure funnel flags reflect that
    (function() {
      try {
        var fs = JSON.parse(localStorage.getItem('autovex_funnel') || '{}');
        fs.loggedIn = true; fs.successVisited = true; fs.offersVisited = true;
        localStorage.setItem('autovex_funnel', JSON.stringify(fs));
      } catch(e) {}
    })();
    // Price overrides — set via scenario panel inputs, persisted in URL
    var OV_ASKING  = _params.get('asking')  ? parseInt(_params.get('asking'),  10) : null;
    var OV_HIGHEST = _params.get('highest') ? parseInt(_params.get('highest'), 10) : null;
    var OV_SECOND  = _params.has('second')  ? (_params.get('second') !== '' ? parseInt(_params.get('second'), 10) : null) : undefined;
    // OV_SECOND === undefined  → use scenario default (may show 2 offers)
    // OV_SECOND === null       → param present but empty → force single offer
    // OV_SECOND === number     → override second offer amount

    // ── Icon strings ──

    var ICO_CHECKMARK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20.285 2 9 13.567 3.714 8.556 0 12.272 9 21 24 5.715z"/></svg>';
    var ICO_WARN_FILL = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/></svg>';
    var ICO_HG_HIGH   = '<svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M184 20H72a20 20 0 0 0-20 20v36a20.1 20.1 0 0 0 8 16l48 36-48 36a20.1 20.1 0 0 0-8 16v36a20 20 0 0 0 20 20h112a20 20 0 0 0 20-20v-35.64a20.13 20.13 0 0 0-7.94-16L147.9 128l48.16-36.4a20.13 20.13 0 0 0 7.94-16V40a20 20 0 0 0-20-20m-4 24v16H76V44Zm-52 69L89.33 84h77Zm52 99H76v-30l52-39 52 39.33Z"/></svg>';

    // ── Formatters ──
    function fmtCurrency(n) { return n ? n.toLocaleString('fi-FI') + ' €' : '—'; }

    }
    function fmtTime(secs)  {
      var s = Math.max(0, secs);
      var d = Math.floor(s / 86400); s -= d * 86400;
      var h = Math.floor(s / 3600);  s -= h * 3600;
      var m = Math.floor(s / 60);    s -= m * 60;
      if (d > 0) return d + ' d ' + h + ' h ' + m + ' min';
      if (h > 0) return h + ' h ' + m + ' min';
      return m + ' min ' + s + ' sec';
    }
    function fmtRelativeTime(isoStr) {
      if (!isoStr) return '';

      if (diff < 60) return diff + ' min sitten';
      var hrs = Math.floor(diff / 60);
      if (hrs < 24) return hrs + ' t sitten';
      return Math.floor(hrs / 24) + ' pv sitten';

    /* ── Contact-info masking — NegotiationResource::replaceContactInfo ──
       Prod masks phone numbers and email addresses out of every negotiation
       message before the thread is ever returned to the browser, including
       digits spelled out in Finnish, English and Swedish. Applied here at
       render time, so the store keeps what the seller typed exactly as prod's
       database does. This is what gives the "Ethän kirjoita puhelinnumeroasi"
       line under the message field its teeth. */
    function maskContactInfo(text) {

        .replace(/\b\d{3,4}\s?\d{2,4}\s?\d{2,4}\b/g, '********')
        .replace(/\b(?:four|five|six|seven|eight|nine)\b/gi, '***')
        .replace(/\b(?:neljä|viisi|kuusi|seitsemän|kahdeksan|yhdeksän)\b/gi, '***')
        .replace(/\b(?:fyra|fem|sex|sju|åtta|nio)\b/gi, '***')

    /* ── Post-auction status — usePostAuctionStatus + postAuctionStatusPredicates ──
       Precedence is prod's, in prod's order. The four price tiers still resolve
       to distinct statuses here, exactly as prod still returns four constants —
       but every one of them now maps to the SAME message config (see
       OFFERS_PENDING_ACTION_* below), so the tier only survives as a label. */
    function postAuctionStatus(req, offers) {
      if (!offers.length) return 'no_offers';                                                   // hasNoOffers
      if (offers.every(function(o) { return o.auto_rejected; })) return 'offers_expired';        // allAutoRejected
      if (req.status === 2 || req.status === 4 || req.status === 6 ||
          offers.some(function(o) { return o.status === 1; })) return 'offer_accepted';          // isAuctionAccepted
      if (offers[0] && offers[0].status === 3) return 'final_offer';                             // OFFER_FINAL

      /* prod also treats a rejected HIGHEST offer (and any `rejected_by_seller`,
         a flag this proto's mock shape does not carry) as offer_rejected — not
         only the all-rejected case. */
      if ((offers[0] && offers[0].status === 2) ||
          offers.every(function(o) { return o.status === 2; })) return 'offer_rejected';

      var negSt = offers[0] ? negStatus(NEGOTIATIONS[offers[0].id]) : null;

      /* isExpiredByTime: past expires_at + reactionTimeForOffers. Prod checks it
         BEFORE the negotiation branches, with one exception — a PENDING
         negotiation (the seller's counter-offer still awaiting an answer) keeps
         the auction alive past the deadline. The proto had no expiry branch at
         all, so an expired-but-unrejected auction still read as a price tier. */
      if (_now() > offerExpiryTs(req) && negSt !== 0) return 'offers_expired';

      if (negSt === 8) return 'negotiation_stopped';

      var highest = req.highest_offer || (offers[0] ? offers[0].amount : 0);
      var asking  = req.asking_price || 0;
      if (highest > asking)        return 'excellent_auction';
      if (highest === asking)      return 'matches_expectations';
      if (highest >= asking * 0.8) return 'good_auction';
      return 'not_great_auction';
    }

    // ── Bid progression generator ──
    // Produces `steps` values from base→highest with variable increments (min 50€ each).
    // Uses a fixed weight pattern to give a non-linear, realistic-looking progression.
    function genInsights(count, highest) {
      if (!count || !highest) return [];
      var base       = Math.round(highest * 0.65 / 100) * 100;
      var steps      = Math.max(3, count);
      var totalRange = highest - base;

      // Fallback: range too small for varied steps — equal distribution
      if (totalRange < steps * 50) {
        var eq = [];
        for (var i = 1; i <= steps; i++) {
          eq.push(Math.round((base + totalRange * i / steps) / 50) * 50);
        }
        eq[eq.length - 1] = highest;
        return eq;
      }

      // Variable weight pattern — repeats for large step counts
      var PATTERN = [1, 1.5, 0.7, 2.0, 0.8, 1.3, 0.6, 1.8, 1.1, 0.9, 1.4, 0.75];
      var weights = [], wSum = 0;
      for (var i = 0; i < steps; i++) {
        var w = PATTERN[i % PATTERN.length];
        weights.push(w);
        wSum += w;
      }

      // Raw increments rounded to nearest 50, floor at 50
      var increments = weights.map(function(w) {
        return Math.max(50, Math.round((w / wSum) * totalRange / 50) * 50);
      });

      var out = [], cur = base;
      for (var i = 0; i < steps - 1; i++) {
        var remaining = steps - 1 - i;
        // Cap so remaining steps can still each contribute ≥50
        var maxNext = highest - remaining * 50;
        cur = Math.min(cur + increments[i], maxNext);
        // Ensure strictly increasing by at least 50
        if (out.length > 0) cur = Math.max(cur, out[out.length - 1] + 50);
        out.push(cur);
      }
      out.push(highest);
      return out;
    }

    // AuctionInsights — mirrors AuctionInsights.vue structure (dl + chart area + dates)
    function buildInsights(req, offers) {
      var offerCount = req.offer_count || offers.length;
      var buyers     = req.buyers || 0;
      var askingFmt  = fmtCurrency(req.asking_price);
      var startFmt   = new Date(req.published_at * 1000).toLocaleDateString('fi-FI', { day: 'numeric', month: 'long', year: 'numeric' });
      var endFmt     = new Date(req.auction_ends_at * 1000).toLocaleDateString('fi-FI', { day: 'numeric', month: 'long', year: 'numeric' });

      // Stats row — mirrors <dl class="flex flex-row divide-x divide-slate-200 text-center">
      /* prod's `auction_details.bids` and `.buyers` are plural forms —
         "Tarjousta|Tarjous|Tarjousta" and "Autoliikettä|Autoliike|Autoliikettä",
         i.e. the singular is used at exactly 1. The proto hardcoded the plural,
         which is wrong on a single-offer auction (reachable with `second=`). */
      var bidsLabel   = offerCount === 1 ? 'Tarjous'   : 'Tarjousta';
      var buyersLabel = buyers === 1     ? 'Autoliike' : 'Autoliikettä';

      var html = '<dl class="flex flex-row divide-x divide-slate-200 text-center">';
      html += '<div class="flex-auto flex flex-col px-2 py-1"><dt class="order-1 text-xs text-slate-500">' + bidsLabel + '</dt><dd class="font-bold text-slate-800">' + offerCount + '</dd></div>';
      html += '<div class="flex-auto flex flex-col px-2 py-1"><dt class="order-1 text-xs text-slate-500">' + buyersLabel + '</dt><dd class="font-bold text-slate-800">' + buyers + '</dd></div>';
      html += '<div class="flex-auto flex flex-col px-2 py-1"><dt class="order-1 text-xs text-slate-500">Odotettu hinta</dt><dd class="font-bold text-slate-800">' + askingFmt + '</dd></div>';
      html += '</dl>';

      // Chart — uses req.insights_data (pre-generated bid progression, mirrors offers.astro formula)
      // data = [0, ...insights_data], chart starts at 0 bottom-left and rises to highest bid
      var ascending = (req.insights_data && req.insights_data.length) ? req.insights_data : [];
      if (ascending.length) {
        var asking = req.asking_price || 12000;
        var highestBidVal = ascending[ascending.length - 1] || 0;
        var chartData = [0].concat(ascending);  // leading 0, then bids
        var n = chartData.length;
        var W = 600, CHART_H = 200, TOP_PAD = 35, BOT_PAD = 10, SIDE_PAD = 12;
        var TOTAL_H = TOP_PAD + CHART_H + BOT_PAD; // 245
        // Use max(asking, highest) + 5% headroom so the bid progression fills the chart vertically
        var yMax = Math.max(asking, highestBidVal) * 1.05;

        function yC(v) { return TOP_PAD + CHART_H - (v / yMax) * CHART_H; }
        function xC(i) { return n > 1 ? SIDE_PAD + (i / (n - 1)) * (W - 2 * SIDE_PAD) : W / 2; }

        var askY = Math.round(yC(asking));
        var pts = chartData.map(function(v, i) { return Math.round(xC(i)) + ',' + Math.round(yC(v)); });

        // Fill polygon: bid line + bottom baseline
        var botY = TOP_PAD + CHART_H;
        var fillPts = pts.join(' ') + ' ' + Math.round(xC(n-1)) + ',' + botY + ' ' + Math.round(xC(0)) + ',' + botY;

        // Labels — asking price at left, highest bid at right — both in boxes above the line
        var askLabelX = SIDE_PAD;
        var askLabelY = Math.max(askY - 6, TOP_PAD - 2); // clamp within SVG
        var highestBid = highestBidVal;
        var highY = Math.round(yC(highestBid));
        var highLabelX = W - SIDE_PAD;
        var highLabelY = Math.max(highY - 6, TOP_PAD - 2);
        var LW = 74, LH = 18, LR = 3;

        html += '<div class="my-3 py-3 border-y border-slate-200 overflow-visible">' +
          '<svg viewBox="0 0 ' + W + ' ' + TOTAL_H + '" class="w-full" style="height:auto;display:block">' +
            // Fill area under bid line
            '<polygon points="' + fillPts + '" fill="#EEF6FA" opacity="0.8"/>' +
            // Asking price dashed line
            '<line x1="' + SIDE_PAD + '" y1="' + askY + '" x2="' + (W-SIDE_PAD) + '" y2="' + askY + '" stroke="#0B6DFF" stroke-dasharray="5,5" stroke-width="1.5"/>' +
            // Bid line — always render when we have at least one offer (n >= 2 means [0, bid])
            '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#2890FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
            // Asking price label box — left-anchored
            '<rect x="' + askLabelX + '" y="' + (askLabelY - LH + 4) + '" width="' + LW + '" height="' + LH + '" rx="' + LR + '" fill="white" stroke="black" stroke-width="0.8"/>' +
            '<text x="' + (askLabelX + LW/2) + '" y="' + (askLabelY - 1) + '" text-anchor="middle" font-size="9" fill="black" font-family="system-ui,sans-serif">' + fmtCurrency(asking) + '</text>' +
            // Highest bid label box — right-anchored
            '<rect x="' + (highLabelX - LW) + '" y="' + (highLabelY - LH + 4) + '" width="' + LW + '" height="' + LH + '" rx="' + LR + '" fill="white" stroke="black" stroke-width="0.8"/>' +
            '<text x="' + (highLabelX - LW/2) + '" y="' + (highLabelY - 1) + '" text-anchor="middle" font-size="9" fill="black" font-family="system-ui,sans-serif">' + fmtCurrency(highestBid) + '</text>' +
          '</svg>' +
        '</div>';
      } else {
        html += '<div class="my-3 py-3 border-y border-slate-200 flex items-center justify-center text-slate-400 text-sm" style="height:245px">Ei dataa</div>';
      }

      // Start/end dates
      html += '<div class="flex flex-row justify-between text-xs text-slate-500"><div>' + startFmt + '</div><div>' + endFmt + '</div></div>';
      return html;
    }

    /* Restored: this lived inside the old scenario drawer, so deleting that
       drawer also deleted it — breaking ?trigger=dealer-reply and the scenario
       seeding below, which both call it. */
    /* opts.deterministic drops the randomness (scenario seeding needs a stable
       thread); opts.close makes this the reply that CLOSES the negotiation.

       Closing used to be a 40% dice roll here, and because `sticks` is true for
       any counter under about 103% of the standing offer, that roll fired on most
       first replies and took the seller's second round away — prod gives them two.
       Whether the dealer closes is a distinct thing to demo, so it is now the
       caller's explicit choice: the bar has a separate action for it. */
    function computeDealerReply(offer, neg, opts) {
      opts = opts || {};
      var msgs = (neg && neg.messages) || [];
      var lastSeller = msgs.filter(function(m) { return m.sender === 'seller'; }).slice(-1)[0];
      var lastDealer = msgs.filter(function(m) { return m.sender === 'dealer'; }).slice(-1)[0];
      var counter = lastSeller ? lastSeller.amount : offer.amount;
      var floor = Math.max(offer.amount, lastDealer ? lastDealer.amount : 0);
      var proposed = Math.max(Math.round(counter * 0.97), floor);
      /* Never above the seller's counter-offer — reaching it means the dealer
         agrees to it — and never below their own standing offer, which prod
         enforces server-side: DealerNegotiationMessageAmount rejects any reply
         under `tenderOffer.amount`. The floor wins, because the seller may
         counter BELOW the standing offer (validation caps only the upper bound)
         and `min(proposed, counter)` alone then produced a reply the API would
         have refused. */
      var amount = Math.max(Math.min(proposed, counter), floor);
      /* `>=`, not `===`: a reply at or above the ask satisfies it. Equality alone
         missed the clamped case, where the floor already exceeds the counter. */
      var meets = amount >= counter;
      var sticks = !meets && (amount <= floor || (!opts.deterministic && Math.random() < 0.3));
      if (sticks) amount = floor;
      /* A close NEVER moves the price: CloseNegotiation copies
         `tenderOffer->amount` as-is. So it always lands on the standing offer,
         whatever the seller asked — and it closes unconditionally, rather than
         quietly declining to when it could have met the counter. */
      var closes = !!opts.close;
      if (closes) amount = floor;

      /* The repeated AMOUNT is prod. An ordinary reply only has to satisfy
         `amount >= tenderOffer.amount` (DealerNegotiationMessageAmount — equal
         passes), and prod names that case outright: `$isKeepOffer` in
         StoreDealerNegotiation. A reply also updates `tenderOffer.amount`, which
         the close then copies — so "dealer keeps their offer, then closes" shows
         the same figure twice by construction, not by accident.

         The TEXT is different: prod's dealer types it, `nullable|string|max:999`,
         and nothing server-side ever repeats their previous message. So a second
         sticking reply sends the amount with no message rather than the same
         sentence twice.

         opts.silent is the dealer clearing the box — `message` is nullable and
         CloseNegotiation stores exactly what arrived, so an amount-only bubble is
         a real prod shape, not a proto shortcut. Otherwise the close carries
         prod's own `close_negotiation.message_pre_filled`, which
         CloseNegotiation.vue pre-fills and most dealers will send untouched. */
      var repeatSticks = sticks && !!lastDealer && lastDealer.amount === amount;
      /* Auto-close. `negotiations:auto-close` runs at 12:00 on weekdays and
         closes any negotiation past its `auto_close.at` — dueAt (the SLA in OPEN
         hours) + 1 day at 12:00, skipped forward off non-business days. So the
         copy's "24 tuntia arkiaikaa" is prod's own arithmetic.

         What the seller reads is prod's oddity, reproduced: the scheduled
         command passes `buyer_close_negotiation_reply`, the DEALER's pre-filled
         message, so an unanswered negotiation closes with a sentence written as
         if the dealership had replied ("kiitos viestistäsi"). The honest string
         `auto_close_negotiation_reply` exists and is used by the sibling command
         `requirements:auto-complete`, which is not scheduled anywhere in the
         dump. Change 9 is that one-line swap, so v1 shows the seller a close
         they can tell apart from a dealer's. */
      if (opts.autoClose) {
        return {
          amount: floor,
          closes: true,
          message: EN_V1
            ? 'Neuvottelu on nyt päättynyt. Viimeisin tarjous odottaa päätöstäsi.'
            : 'Hei ja kiitos viestistäsi. Tämä on korkein tarjous, jonka voimme autostasi tällä hetkellä antaa. Kiitos, että harkitset tarjoustamme.'
        };
      }
      var text = opts.silent ? ''
        : meets
          ? 'Hei! Käy kaupaksi — hyväksymme ehdottamasi hinnan. Toivottavasti pääsemme kauppoihin!'
          : closes
            ? 'Hei ja kiitos viestistäsi. Tämä on korkein tarjous, jonka voimme autostasi tällä hetkellä antaa. Kiitos, että harkitset tarjoustamme.'
            : repeatSticks
              ? ''
              : sticks
                ? 'Hei! Pysymme aiemmassa tarjouksessamme — tämä on paras tarjous, jonka voimme antaa.'
                : 'Hei! Tämä on paras tarjous, jonka voimme tällä hetkellä antaa. Toivottavasti pääsemme kauppoihin!';
      return { amount: amount, closes: closes, message: text };
    }

    /* prod's useNegotiation().dealerCanSendMessage — two rounds each, and neither
       side may send twice in a row. The simulate actions honour it so repeated
       clicks cannot stack dealer messages the app would never produce. */
    function dealerCanReply(neg) {
      var msgs = (neg && neg.messages) || [];
      var dealerRounds = msgs.filter(function(m) { return m.sender === 'dealer'; }).length;
      var lastMsg = msgs[msgs.length - 1];
      return dealerRounds < 2 && (!lastMsg || lastMsg.sender !== 'dealer') && !(neg && neg.isStopped);
    }

    /* The scenarios that only exist BECAUSE a negotiation happened. Resetting
       has to leave them, or the cards keep saying "Vastatarjous lähetetty" over
       a thread that is gone — and the seeding blocks would rebuild the thread on
       the next load. `seen-offers` is the same world without the negotiation:
       identical request shape (ACTIVE window, offers already revealed), no
       negotiation_pending on any offer. */
    var NEGOTIATION_SCENARIOS = ['counter-offer-sent', 'dealer-replied', 'negotiation-stopped'];

    /* Reset used to clear NEGOTIATIONS and re-render in place, which left the
       modal open over the thread it had just deleted and left SCENARIO on a
       negotiation state. It now navigates, so every card, badge, scenario menu
       and the modal rebuild from one consistent state — the offers view a seller
       sees before they negotiate. A scenario the tester deliberately picked and
       that is not negotiation-derived (final-offer, all-rejected, …) is kept:
       reset undoes the negotiation, not their setup. */
    function resetNegotiations() {
      NEGOTIATIONS = {};
      var target = NEGOTIATION_SCENARIOS.indexOf(SCENARIO) !== -1 ? 'seen-offers' : SCENARIO;
      SCENARIO = target;
      saveState();
      var url = new URL(window.location.href);
      url.searchParams.set('scenario', target);
      window.location.href = url.toString();
    }

    /* Every dealer-side action on the bar. opts.close ends the negotiation
       (prod's STATUS_STOPPED); opts.silent sends the amount with no message.
       A plain reply leaves it open so the seller keeps their second round.

       The turn/round guard applies to closing too, and that IS prod: the dealer's
       CloseNegotiation control is rendered `v-if="dealerCanSendMessage"`
       (Negotiation.vue), so the close is reachable exactly where a reply is —
       instead of answering the seller, never straight after their own reply. The
       API itself has no such check; the UI is the gate. */
    function simulateDealerReply(opts) {
      opts = opts || {};
      var _h = (getData().offers || [])[0];
      if (!_h) return;
      var _neg  = NEGOTIATIONS[_h.id] || { messages: [], isStopped: false };
      var _msgs = _neg.messages || [];
      if (!_msgs.filter(function (m) { return m.sender === 'seller'; }).length) {
        alert('Send a counter-offer first');
        return;
      }
      if (!dealerCanReply(_neg)) {
        alert(_neg.isStopped
          ? 'The negotiation is closed — reset counter offers to start over'
          : 'Not the dealer\u2019s turn. In prod their reply and close controls both\n' +
            'require dealerCanSendMessage, so they act only after your counter-offer,\n' +
            'and only twice. Send a counter-offer, or reset counter offers.');
        return;
      }
      var _reply = computeDealerReply(_h, _neg, { close: opts.close, silent: opts.silent, autoClose: opts.autoClose });
      _neg.messages.push({
        sender: 'dealer',
        amount: _reply.amount,
        message: _reply.message,
        created_at: new Date().toISOString()
      });
      /* Only an explicit close stops it. Running out of rounds does NOT:
         prod's STATUS_STOPPED means the dealer closed the negotiation, while a
         thread where both sides used both rounds is still COUNTER_OFFER_SENT —
         and the seller's modal then takes Negotiate.vue's
         `rounds == 2 && waitingForSeller` branch rather than the stopped one. */
      if (_reply.closes) _neg.isStopped = true;
      NEGOTIATIONS[_h.id] = _neg;
      SCENARIO = _neg.isStopped ? 'negotiation-stopped' : 'dealer-replied';
      saveState();
      renderPage();
      openModal('Negotiate', _h.id);
    }

    /* Consumed by proto-bar.js. Everything beyond the scenario list lives behind
       the bar's single **Auction settings** button: the three price overrides
       (persisted in the URL, read at load) and the three negotiation actions
       (mutate simulated state, then re-render). Inline they were seven controls
       on a strip shared with every page's own rows — see proto-bar.js.
       `second` uses keepEmpty because present-but-empty means "force a single
       offer", distinct from the param being absent. */
    window.protoPage = {
      scenarios: SCENARIO_GROUPS,
      initiatives: [
        {
          slug:    'enhanced-negotiations',   // name + spec live in proto-mode's registry
          default: 'control',                 // no param renders production
          variants: [
            { id: 'control', label: 'Control — current design' },
            { id: 'v1',      label: 'Variant 1 — enhanced negotiation' }
          ]
        }
      ],
      panelLabel: 'Auction settings',
      panelTitle: 'Auction prices and simulated dealer responses',
      fieldsLabel: 'Prices €',
      fields: [
        { key: 'asking',  label: 'Asking price €',  placeholder: 'asking' },
        { key: 'highest', label: 'Highest offer €', placeholder: 'highest' },
        { key: 'second',  label: '2nd highest €', placeholder: 'empty = 1 offer', width: '110px', keepEmpty: true }
      ],
      actionsLabel: 'Dealer response',
      actions: [
        {
          label: 'Reply, negotiation continues',
          title: 'Dealer answers your counter-offer and leaves the negotiation open',
          run: function () { simulateDealerReply({ close: false }); }
        },
        {
          /* prod's CloseNegotiation.vue pre-fills close_negotiation.message_pre_filled,
             so this is what a seller sees when the dealer sends it untouched. */
          label: 'Close, with message',
          title: 'Dealer closes at their standing offer, sending prod\u2019s pre-filled closing message',
          run: function () { simulateDealerReply({ close: true }); }
        },
        {
          /* `message` is nullable and CloseNegotiation stores what arrived, so a
             dealer who clears the box closes with the amount alone. */
          label: 'Close, no message',
          title: 'Dealer clears the message box and closes — the bubble carries only the amount',
          run: function () { simulateDealerReply({ close: true, silent: true }); }
        },
        {
          /* The deadline expiring, not the dealer acting. Same STATUS_STOPPED,
             and in prod today the same message — which is change 9's point. */
          label: 'Auto-close (deadline passed)',
          title: 'Nobody replied within 24 business hours, so negotiations:auto-close closed it at 12:00',
          run: function () { simulateDealerReply({ close: true, autoClose: true }); }
        },
        {
          label: 'Reset counter offers',
          title: 'Clear the negotiation and reload on the offers view, before any counter-offer',
          run: function () { resetNegotiations(); }
        }
      ]
    };

    /* Scenario panel moved to the shared proto bar (proto-bar.js). */

    // Create modal element (must exist before wiring)
    var modalEl = document.createElement('div');
    modalEl.id = 'offer-modal';
    modalEl.className = 'hidden fixed inset-0 z-50 overflow-y-auto';
    modalEl.style.background = 'rgba(30,41,59,0.5)';
    modalEl.innerHTML =
      '<div class="min-h-full px-4 py-8 flex items-start justify-center">' +
        '<div id="offer-modal-panel" class="relative bg-white rounded-lg w-full max-w-2xl">' +
          '<button id="modal-close-btn" class="absolute top-0 right-0 p-4 h-12 w-12 flex items-center justify-center text-2xl leading-none text-black hover:text-slate-600 z-10" aria-label="Sulje">&times;</button>' +
          '<div id="modal-body" class="p-4 lg:p-6 pt-12"></div>' +
          '<div id="modal-footer-wrap"><div id="modal-footer" class="p-4 border-t border-gray-300"></div></div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(modalEl);

    // Pre-populate negotiation state for counter-offer-sent scenario
    if (SCENARIO === 'counter-offer-sent') {
      var _coData = getData();
      (_coData.offers || []).forEach(function(o) {
        if (o.negotiation_pending && !NEGOTIATIONS[o.id]) {
          NEGOTIATIONS[o.id] = {
            messages: [
              { sender: 'seller', amount: 11700, message: 'Hei! Haluaisin tästä hieman enemmän. Minkä verran joustoa teillä on?', created_at: new Date((_now()-2*3600)*1000).toISOString() }
            ],
            isStopped: false
          };
        }
      });
    }

    // Pre-populate negotiation state for dealer-replied scenario
    if (SCENARIO === 'dealer-replied') {
      var _drData = getData();
      (_drData.offers || []).forEach(function(o) {
        if (!o.dealer_replied) return;
        if (!NEGOTIATIONS[o.id]) {
          // No negotiation yet — seed full thread with default seller + dealer messages
          NEGOTIATIONS[o.id] = {
            messages: [
              { sender: 'seller', amount: 11700, message: 'Hei! Haluaisin tästä hieman enemmän. Minkä verran joustoa teillä on?', created_at: new Date((_now()-5*3600)*1000).toISOString() },
              { sender: 'dealer', amount: 11600, message: 'Hei! Tämä on paras tarjous, jonka voimme tällä hetkellä antaa. Toivottavasti pääsemme kauppoihin!', created_at: new Date((_now()-1*3600)*1000).toISOString() }
            ],
            isStopped: false
          };
        } else {
          // Negotiation exists from prior scenario — add dealer reply if none present
          var _hasDealerReply = NEGOTIATIONS[o.id].messages.some(function(m) { return m.sender === 'dealer'; });
          if (!_hasDealerReply) {
            var _seedReply = computeDealerReply(o, NEGOTIATIONS[o.id], { deterministic: true });
            NEGOTIATIONS[o.id].messages.push({
              sender: 'dealer',
              amount: _seedReply.amount,
              message: _seedReply.message,
              created_at: new Date((_now()-1*3600)*1000).toISOString()
            });
          }
        }
      });
    }

    // Pre-populate negotiation state for negotiation-stopped scenario
    if (SCENARIO === 'negotiation-stopped') {
      var _nsData = getData();
      (_nsData.offers || []).forEach(function(o) {
        if (o.negotiation_pending && !NEGOTIATIONS[o.id]) {
          NEGOTIATIONS[o.id] = {
            messages: [
              { sender: 'seller', amount: 11700, message: 'Hei! Haluaisin tästä hieman enemmän. Minkä verran joustoa teillä on?', created_at: new Date((_now()-5*3600)*1000).toISOString() },
              { sender: 'dealer', amount: 11600, message: 'Hei! Tämä on paras tarjous, jonka voimme tällä hetkellä antaa. Toivottavasti pääsemme kauppoihin!', created_at: new Date((_now()-3*3600)*1000).toISOString() },
              { sender: 'seller', amount: 11650, message: 'Okei, voisiko 11 650 € onnistua?', created_at: new Date((_now()-2*3600)*1000).toISOString() },
              /* The close itself. CloseNegotiation always creates a DEALER
                 message carrying tenderOffer->amount unchanged, so a stopped
                 thread always ends on the dealership — the seeded thread used to
                 end on the seller, which prod cannot produce. Copy is prod's own
                 close_negotiation.message_pre_filled. */
              { sender: 'dealer', amount: 11600, message: 'Hei ja kiitos viestistäsi. Tämä on korkein tarjous, jonka voimme autostasi tällä hetkellä antaa. Kiitos, että harkitset tarjoustamme.', created_at: new Date((_now()-1*3600)*1000).toISOString() }
            ],
            isStopped: true
          };
        }
      });
    }

    // Wire modal close
    document.getElementById('modal-close-btn').addEventListener('click', closeModal);
    document.getElementById('offer-modal').addEventListener('click', function(e) {
      var panel = document.getElementById('offer-modal-panel');
      var path = e.composedPath ? e.composedPath() : [];
      var insidePanel = path.indexOf(panel) !== -1 || panel.contains(e.target);
      if (!insidePanel) closeModal();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && !document.getElementById('offer-modal').classList.contains('hidden')) closeModal();
    });

    // URL trigger: ?trigger=dealer-reply adds dealer reply to existing negotiations and switches to dealer-replied scenario
    if (_params.get('trigger') === 'dealer-reply') {
      var _td = getData();
      (_td.offers || []).slice(0, 1).forEach(function(o) {
        var _tNeg = NEGOTIATIONS[o.id] || { messages: [], isStopped: false };
        var _tHasDealer = _tNeg.messages.some(function(m) { return m.sender === 'dealer'; });
        if (!_tHasDealer) {
          /* The email link never closes the negotiation — it is an answer the
             seller is being invited to respond to. */
          var _tReply = computeDealerReply(o, _tNeg);
          _tNeg.messages.push({ sender: 'dealer', amount: _tReply.amount, message: _tReply.message, created_at: new Date().toISOString() });
          NEGOTIATIONS[o.id] = _tNeg;
          var _tScenario = _tNeg.isStopped ? 'negotiation-stopped' : 'dealer-replied';
          SCENARIO = _tScenario;
          var _cleanUrl = new URL(window.location.href);
          _cleanUrl.searchParams.delete('trigger');
          _cleanUrl.searchParams.set('scenario', _tScenario);
          window.history.replaceState({}, '', _cleanUrl.toString());
        } else {
          // Dealer already replied — just clean the trigger param
          var _cleanUrl2 = new URL(window.location.href);
          _cleanUrl2.searchParams.delete('trigger');
          window.history.replaceState({}, '', _cleanUrl2.toString());
        }
      });
    }

    /* Change 11. The dealer-replied and negotiation-closed emails land on the
       offers LIST today, so the seller has to find the car and then work out that
       the reply is behind a secondary button. The link now lands on the decision
       page for that car — and stops there. Opening the thread automatically was
       tried and dropped: the seller should see the page they arrived at, decide
       what to look at, and open the negotiation themselves. */

    // Boot
    saveState();
    renderPage();
  })();
  </script>


  <script src="proto-bar.js"></script>
</body>
</html>
