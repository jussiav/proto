<body class="font-dm bg-white min-h-screen">

  <div class="flex flex-col items-center pt-8 pb-16 min-h-screen max-md:pt-0 max-md:pb-0">
    <div class="flex items-start justify-between w-full max-w-[1440px] px-8 gap-8 max-md:flex-col max-md:px-0 max-md:gap-0">

      <!-- ── Left column ── -->
      <div class="flex-1 flex flex-col items-start gap-6 max-w-[512px] max-md:max-w-full max-md:w-full max-md:px-5 max-md:pt-5 max-md:pb-8">

        <!-- Logo -->
        <a href="index.html" aria-label="Takaisin etusivulle" data-i18n-aria="success.backToHome">
          <img src="assets/0ee90a56-efbf-4799-9249-76f362c9facf.svg"
               alt="AutoVex"
               class="w-[88px] h-[18px] object-contain block" />
        </a>

        <!-- Headline + subtext + badge -->
        <div id="success-headline-section" class="flex flex-col gap-2.5 w-full text-center items-center">
          <h1 id="success-headline" class="font-barlow font-bold text-slate-900 text-2xl leading-[26px]">
            Hienoa! Ilmoitustasi tarkastetaan parhaillaan.
          </h1>
          <p id="success-subtext" class="font-dm text-base leading-5 text-black">
            Olemme sinuun yhteydessä puhelimitse viimeistään huomenna, jotta saadaan autosi myytyä mahdollisimman pian.
          </p>
          <div id="success-badge" class="hidden items-center gap-2 rounded px-2 py-1">
            <span id="success-badge-icon" class="w-3.5 h-3.5 flex-shrink-0 flex items-center justify-center"></span>
            <span id="success-badge-text" class="font-dm font-medium text-sm"></span>
          </div>
        </div>

        <!-- Illustration -->
        <div id="success-illustration-wrap" class="w-full flex items-center justify-center">
          <img id="success-illustration"
               src="assets/5c60c059-afbf-433e-8541-bd611d13e275.svg"
               alt=""
               class="w-[288px] h-auto object-contain" />
        </div>

        <!-- Email verification card (shown when email not yet verified) -->
        <div id="success-email-card" class="hidden w-full border-2 border-av-blue rounded-xl p-4 flex flex-col gap-6">
          <div class="flex items-center justify-between">
            <img src="assets/icon-email-envelope.svg" class="w-8 h-8 flex-shrink-0" alt="" />
            <div class="bg-white border border-slate-200 rounded px-2 py-0.5">
              <span id="success-email-address" class="font-dm font-medium text-base text-slate-600 whitespace-nowrap"></span>
            </div>
          </div>
          <div class="flex flex-col gap-5">
            <div class="flex flex-col gap-2.5">
              <p id="success-email-card-title" class="font-dm font-bold text-lg text-slate-800 leading-[22px]"></p>
              <p id="success-email-card-body" class="font-dm font-medium text-base text-slate-600 leading-5"></p>
            </div>
            <div class="flex flex-col gap-2">
              <p id="success-email-card-no-email" class="font-dm font-bold text-base text-slate-800 leading-5"></p>
              <button id="success-email-resend" class="font-dm font-medium text-base text-slate-600 leading-5 underline text-left bg-transparent border-none p-0 cursor-pointer"></button>
            </div>
          </div>
        </div>

        <!-- Notice card — in_review(verified)/published states only. Visual style + copy
             confirmed verbatim against Review.vue's template (in_review+verified branch)
             and Success.vue (bg-[rgb(250,234,218)] border-orange-300, underlined text link). -->
        <div id="success-notice" class="hidden text-start w-full bg-[rgb(250,234,218)] rounded-lg p-4 gap-2 items-center border-2 border-orange-300">
          <div class="flex flex-col">
            <span id="success-notice-title" class="mb-2.5 text-xl text-slate-800 font-bold"></span>
            <span id="success-notice-body" class="mb-4 text-base font-medium text-slate-600"></span>
            <a id="success-notice-cta" href="#" class="text-slate-600 underline cursor-pointer font-medium"></a>
          </div>
        </div>

        <!-- Action card — rejected / rejected+missing-images states. Confirmed against
             Review.vue's <Notification> usage there: bordered card, icon, title, body,
             and a primary BUTTON (not a text link) — a different component than the
             peach notice above, which Review.vue reserves for in_review+verified/published. -->
        <div id="success-action-card" class="hidden p-6 flex-col space-y-4 rounded-xl border-2 bg-white">
          <div class="flex justify-start items-center gap-x-1.5">
            <span id="success-action-card-icon"></span>
          </div>
          <div class="flex flex-col space-y-2.5">
            <span id="success-action-card-title" class="text-xl text-slate-800 font-bold"></span>
            <span id="success-action-card-body" class="text-slate-600"></span>

              <span id="success-action-card-cta-text" style="font-family:'DM Sans',sans-serif;font-weight:500;font-size:1rem;color:white;"></span>
            </a>
          </div>
        </div>

      </div>

      <!-- ── Right column (cream) ── -->
      <div class="flex-1 bg-av-cream rounded-xl p-8 min-h-[480px] flex flex-col gap-6 max-w-[48%] md:sticky md:top-8 md:h-[calc(100vh-4rem)] md:overflow-y-auto max-md:max-w-full max-md:w-full max-md:h-auto max-md:rounded-none max-md:px-5 max-md:py-8">

        <h2 id="success-next-steps-title" class="font-dm font-bold text-xl leading-[23px] text-black" data-i18n="success.nextStepsTitle">Mitä tapahtuu seuraavaksi?</h2>

        <div id="success-steps" class="flex flex-col gap-5">

          <div id="success-step1-row" class="flex gap-2 items-start">
            <img src="assets/cf9ed64c-e015-4129-a683-516894e443b4.svg" class="w-6 h-6 flex-shrink-0 mt-0.5" alt="1" />
            <div class="flex flex-col gap-0.5">

            </div>
          </div>

          <div id="success-step2-row" class="flex gap-2 items-start">
            <img src="assets/7cb7ddce-86cc-457f-be2d-f44485a7e101.svg" class="w-6 h-6 flex-shrink-0 mt-0.5" alt="2" />
            <div class="flex flex-col gap-0.5">
              <p id="step2-title" class="font-dm font-bold text-base leading-5 text-black"></p>

            </div>

          <div id="success-step3-row" class="flex gap-2 items-start">
            <img src="assets/d7dbeec3-32bb-407c-a234-273ace9af998.svg" class="w-6 h-6 flex-shrink-0 mt-0.5" alt="3" />
            <div class="flex flex-col gap-0.5">
              <p id="step3-title" class="font-dm font-bold text-base leading-5 text-black"></p>
              <p id="step3-body" class="font-dm text-base leading-5 text-black"></p>
            </div>
          </div>

          <div id="success-step4-row" class="flex gap-2 items-start">
            <img src="assets/step-4.svg" class="w-6 h-6 flex-shrink-0 mt-0.5" alt="4" />
            <div class="flex flex-col gap-0.5">
              <p id="step4-title" class="font-dm font-bold text-base leading-5 text-black"></p>
              <p id="step4-body" class="font-dm text-base leading-5 text-black"></p>

          <div id="success-step5-row" class="flex gap-2 items-start">

            <div class="flex flex-col gap-0.5">
              <p id="step5-title" class="font-dm font-bold text-base leading-5 text-black"></p>
              <p id="step5-body" class="font-dm text-base leading-5 text-black"></p>

          </div>

        </div>

        <a id="success-offers-btn" href="offers.html?scenario=draft-in-review"
           style="display:none;align-items:center;justify-content:center;background:#0B6DFF;border-radius:.5rem;height:3.5rem;padding:0 2rem;text-decoration:none;box-shadow:inset 0px 1px 2px 1px rgba(255,255,255,0.2);">
          <span style="font-family:'DM Sans',sans-serif;font-weight:500;font-size:1rem;color:white;">Näytä tarjouspyyntöni</span>
        </a>

        <!-- Car preview — bottom of the tan column, below "what happens next" -->
        <div id="av-vehicle-card" class="w-full mt-auto"></div>

      </div>

    </div>
  </div>

  <script src="vehicle-card.js"></script>
  <script>
    const STORE_KEY = 'autovex_funnel';
    function getStore() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch { return {}; } }
    function setStore(d) { try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch(e) {} }

    // DAC7: emails starting with "dac" belong to previous AutoVex sellers and
    // must complete the dac7 form before reaching the verified treatment
    function isDacUser(s) {
      return ((s.contact || {}).sahkoposti || '').trim().toLowerCase().indexOf('dac') === 0;
    }

    function photosComplete(s) {
      const ph = s.photos || {};
      const total = Object.values(ph).reduce((n, a) => n + (a ? a.length : 0), 0);
      return total >= 5 && !!(ph.ulkopuoli && ph.ulkopuoli.length) && !!(ph.sisatilat && ph.sisatilat.length);
    }

    // ── Scenario param — forces one of prod's draft-status branches, overriding the
    // organic photos/email simulation below. Mirrors offers.html's ?scenario= pattern. ──
    var _successParams = new URLSearchParams(window.location.search);
    var FORCED_SCENARIO = _successParams.get('scenario');
    var FORCED_COPY = _successParams.get('copy') === 'default' ? null : _successParams.get('copy');

    // "What happens next" step copy — verbatim from WhatHappensNext.vue /
    // tenderform.what_happens_next.complete.* locale keys.
    var NS = {
      verify_email:  { t: 'Vahvista sähköpostisi', b: 'Tarkista sähköpostisi ja vahvista osoitteesi jatkaaksesi tarjouskilpailuun.' },
      review:        { t: 'Ilmoituksesi tarkistetaan', b: 'Tiimimme käy läpi ilmoituksesi. Soitamme sinulle, jotta saadaan kaikki kuntoon.' },
      published:     { t: 'Ilmoituksesi julkaistaan', b: 'Tarjouskilpailu käynnistyy, kun ensimmäinen tarjous on tehty.' },
      published_alt: { t: 'Ilmoituksesi on nyt julkaistu', b: 'Tarjouskilpailu käynnistyy, kun ensimmäinen tarjous on tehty.' },
      auction:       { t: 'Tarjouskilpailu käynnistyy', b: 'Tarjouskilpailu kestää tyypillisesti 36 tuntia. Pidämme sinut ajan tasalla sähköpostitse.' },
      auction_ends:  { t: 'Tarjouskilpailu päättyy ja saat tulokset', b: 'Lähetämme sähköpostin kun tarjouskilpailu päättyy. Sinulla on 24 tuntia aikaa reagoida.' },
    };

    // Review-call timing variants — this screen maps to prod's Review.vue, whose own
    // null-fallback (tenderform.review.content.fallback) differs from offers.html's
    // (auction.landing.status_updates.in_review.content) — different Vue component, own default.
    function _nextWorkDayName() {
      var d = new Date();
      var days = { 1: 'maanantaina', 2: 'tiistaina', 3: 'keskiviikkona', 4: 'torstaina', 5: 'perjantaina' };
      do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6);
      return days[d.getDay()];
    }
    var REVIEW_TIMING_FALLBACK = 'Olemme sinuun yhteydessä vielä puhelimitse mahdollisimman pian taataksemme sinulle parhaan mahdollisen asiakaskokemuksen.';
    function reviewTimingText(variant) {
      if (variant === 'soon') return 'Olemme sinuun yhteydessä vielä puhelimitse, jotta autosi saadaan myytyä mahdollisimman pian.';
      if (variant === 'tomorrow') return 'Olemme sinuun yhteydessä vielä puhelimitse viimeistään huomenna, jotta autosi saadaan myytyä mahdollisimman pian.';
      if (variant === 'next_work_day') return 'Olemme sinuun yhteydessä vielä puhelimitse viimeistään ' + _nextWorkDayName() + ', jotta autosi saadaan myytyä mahdollisimman pian.';
      return REVIEW_TIMING_FALLBACK;
    }

    // Badge color/icon per draftStatus — colors match offers.html's DRAFT_STATUS_CFG for the
    // same statuses; cyan (published) is new here, sourced from prod's consumer Success.vue
    // (bg-white border-cyan-400 text-cyan-600, ph-bold-hourglass-high).

    var BADGE_COLORS = {
      slate: { cls: 'bg-slate-200 border border-slate-300 text-slate-500', icon: ICON_HOURGLASS },
      red:   { cls: 'bg-transparent border border-red-300 text-red-700',  icon: ICON_WARNING },
      amber: { cls: 'bg-amber-50 border border-amber-400 text-amber-700', icon: ICON_WARNING },
      cyan:  { cls: 'bg-white border border-cyan-400 text-cyan-600',      icon: ICON_HOURGLASS },
    };
    function setBadge(info) {
      var badge = document.getElementById('success-badge');
      if (!info) { badge.style.display = 'none'; return; }
      var c = BADGE_COLORS[info.color];
      badge.className = 'flex items-center gap-2 rounded px-2 py-1 ' + c.cls;
      badge.style.display = 'flex';
      document.getElementById('success-badge-icon').innerHTML = c.icon;
      document.getElementById('success-badge-text').textContent = info.text;
    }

    function setNotice(info) {
      var el = document.getElementById('success-notice');
      if (!info) { el.classList.add('hidden'); return; }
      document.getElementById('success-notice-title').textContent = info.title;
      document.getElementById('success-notice-body').textContent = info.body;
      var cta = document.getElementById('success-notice-cta');
      cta.textContent = info.cta;
      cta.href = info.href;
      el.classList.remove('hidden');
    }

    // Icons/colors for the action card — 30x30 variants matching offers.html's NICON_FILL_CAR /
    // NICON_FILL_WARN_OCT (same prod icon set: ph-fill-car / ph-fill-warning-octagon).

    var NICON_FILL_WARN_OCT = '<svg width="30" height="30" viewBox="0 0 30 31" fill="currentColor" aria-hidden="true"><path d="m26.638 9.957-6.04-6.04a1.89 1.89 0 0 0-1.326-.55h-8.543a1.89 1.89 0 0 0-1.327.55l-6.04 6.04a1.89 1.89 0 0 0-.55 1.326v8.543c.002.497.2.974.55 1.327l6.04 6.04c.353.35.83.548 1.327.55h8.543a1.89 1.89 0 0 0 1.326-.55l6.04-6.04c.35-.353.548-.83.55-1.327v-8.543a1.89 1.89 0 0 0-.55-1.326ZM14.062 9.93a.938.938 0 0 1 1.876 0v6.562a.938.938 0 0 1-1.876 0V9.93ZM15 22.117a1.407 1.407 0 1 1 0-2.813 1.407 1.407 0 0 1 0 2.813Z"/></svg>';
    var ACTION_CARD_COLORS = {
      // Review.vue: theme="info" (plain rejected) / theme="danger" (missing images)
      blue: { border: 'border-blue-500', icon: 'text-blue-500' },
      red:  { border: 'border-red-400',  icon: 'text-red-500' },
    };
    function setActionCard(info) {
      var el = document.getElementById('success-action-card');
      if (!info) { el.classList.add('hidden'); return; }
      var c = ACTION_CARD_COLORS[info.color];
      el.className = 'flex flex-col space-y-4 rounded-xl border-2 bg-white p-6 ' + c.border;
      document.getElementById('success-action-card-icon').className = c.icon;
      document.getElementById('success-action-card-icon').innerHTML = info.icon === 'car' ? NICON_FILL_CAR : NICON_FILL_WARN_OCT;
      document.getElementById('success-action-card-title').textContent = info.title;
      document.getElementById('success-action-card-body').textContent = info.body;
      document.getElementById('success-action-card-cta-text').textContent = info.cta;
      document.getElementById('success-action-card-cta').href = info.href;
    }

    function renderSteps(keys) {
      // Mirrors WhatHappensNext.vue's own v-if="computedNextSteps.length > 0" on its heading.
      document.getElementById('success-next-steps-title').style.display = keys.length > 0 ? '' : 'none';
      for (var i = 1; i <= 5; i++) {
        var row = document.getElementById('success-step' + i + '-row');
        var item = keys[i - 1] ? NS[keys[i - 1]] : null;
        if (item) {
          document.getElementById('step' + i + '-title').textContent = item.t;
          document.getElementById('step' + i + '-body').textContent = item.b;
          row.style.display = 'flex';
        } else {
          row.style.display = 'none';
        }
      }
    }

    // The 6 real draftStatus branches WhatHappensNext.vue/Review.vue/PublishQueue.vue/
    // Success.vue (consumer) produce. Copy sourced verbatim from tenderform.review.rejected.*,
    // tenderform.publish_queue.*, tenderform.published.* in vue-i18n-locales.generated.js.
    var SUCCESS_SCENARIOS = {
      'rejected': {
        headline: 'Autoasi ei hyväksytty - tällä kertaa.',
        subtext: 'Syynä saattaa olla ajoitus tai puuttuvat tiedot. Ei hätää - voit aina palata myöhemmin.',
        badge: { text: 'Ei hyväksytty', color: 'red' },
        steps: [],
        // Review.vue: <Notification icon="ph-fill-car" theme="info"> + primary button (editDraft)
        actionCard: { icon: 'car', color: 'blue', title: 'Mietitkö vielä?', body: 'Ymmärrämme täysin. Monet asiakkaamme palaavat myynnin pariin myöhemmin ja tekevät hyvät kaupat. Voit päivittää tarjouspyyntöä milloin tahansa.', cta: 'Päivitä tarjouspyyntöä', href: 'index.html' },
        // Copied from prod: resources/assets/img/rejected.png
        illustration: 'assets/success-rejected.png',
      },
      'rejected-missing-images': {
        headline: 'Huomio! Tarvitsemme sinulta lisätietoja.',
        subtext: 'Huomasimme, että joitakin tietoja puuttuu tarjouspyynnöstäsi.',
        badge: { text: 'Tietoja tarvitaan', color: 'red' },
        // Real WhatHappensNext.vue fallthrough for rejected+missingImages: falls to the
        // default 4-step branch (still shows "under review") — an apparent prod quirk,
        // reproduced as-is rather than corrected.
        steps: ['review', 'published', 'auction', 'auction_ends'],
        // Review.vue: <Notification icon="ph-fill-warning-octagon" theme="danger"> + primary button (addMissingImages)
        actionCard: { icon: 'warning', color: 'red', title: 'Lataa kuvat jatkaaksesi', body: 'Ilmoituksesi tarvitsee lisää kuvia ennen julkaisua. Autoliikkeet tarvitsevat selkeitä kuvia tehdäkseen parhaat tarjouksensa. 🚗 📸', cta: 'Lisää kuvat', href: 'photos.html' },
        // Prod's rejected_info_missing.png — already in this prototype byte-identical
        // as success-photos-missing.png (same image, used by the organic photos-missing state).
        illustration: 'assets/success-photos-missing.png',
      },
      'in-review-unverified': {
        headline: 'Tarjouspyyntösi on valmis! Yksi juttu vielä.',
        subtext: 'Olemme vastaanottaneet ilmoituksesi ja tarkistamme sitä parhaillaan. Vahvista nyt sähköpostiosoitteesi.',
        // tenderform.review.status (shown for draftStatus='in_review' regardless of email verification)
        badge: { text: 'Tarkastus käynnissä', color: 'slate' },
        steps: ['verify_email', 'review', 'published', 'auction', 'auction_ends'],
        emailCard: true,
        // Matches prod exactly: Review.vue shows verify_email.png for the unverified case.
        illustration: 'assets/success-verify-email-illustration.png',
      },
      'in-review-verified': {
        headline: 'Hienoa! Ilmoitustasi tarkastetaan parhaillaan.',
        subtext: null,
        // Same badge as the unverified case — Review.vue shows it outside the
        // emailIsVerified branch, unconditionally for draftStatus='in_review'.
        badge: { text: 'Tarkastus käynnissä', color: 'slate' },
        steps: ['review', 'published', 'auction', 'auction_ends'],
        timingVariant: true,
        // prod Review.vue in_review+verified renders this notice (same keys Success.vue uses).
        // Its text link replaces the standalone blue "Näytä tarjouspyyntöni" button.
        notice: { title: 'Ota rennosti ja tarkkaile sähköpostiasi!', body: 'Pidä sähköposti lähettyvillä, ettet vahingossa menetä parasta tarjousta autostasi.', cta: 'Näytä tarjouspyyntöni', href: 'offers.html?scenario=draft-in-review' },
        // Copied from prod: resources/assets/img/in_review.svg
        illustration: 'assets/success-in-review.svg',
      },
      'queued': {
        headline: 'Tarjouspyyntösi on valmis! Yksi juttu vielä.',
        subtext: 'Olemme vastaanottaneet ilmoituksesi ja julkaisemme sen heti kun olet vahvistanut sähköpostiosoitteesi.',
        badge: { text: 'Vaatii toimenpiteitä', color: 'amber' },
        steps: ['verify_email', 'published', 'auction', 'auction_ends'],
        emailCard: true,
        // Prod's PublishQueue.vue reuses the SAME verify_email.png as in_review+unverified.
        illustration: 'assets/success-verify-email-illustration.png',
      },
      'published': {
        headline: 'Jännittävää! Tarjouskilpailu on alkamassa.',
        subtext: 'Autosi on nyt satojen ostajien nähtävillä. Tarjouskilpailu alkaa ensimmäisestä tarjouksesta.',
        badge: { text: 'Odotetaan tarjouksia', color: 'cyan' },
        steps: ['published_alt', 'auction', 'auction_ends'],
        // live-no-bids, not new-offers: this state's badge is "Odotetaan tarjouksia",
        // so the offers page it links to must show a live auction with no bids yet.
        notice: { title: 'Ota rennosti ja tarkkaile sähköpostiasi!', body: 'Pidä sähköposti lähettyvillä, ettet vahingossa menetä parasta tarjousta autostasi.', cta: 'Näytä tarjouspyyntöni', href: 'offers.html?scenario=live-no-bids' },
        // Copied from prod: resources/assets/img/published.png
        illustration: 'assets/success-published.png',
      },
    };

    function renderForcedScenario(id, copyVariant) {
      var def = SUCCESS_SCENARIOS[id];
      if (!def) return false;

      var leftCol = document.getElementById('success-illustration-wrap').parentNode;
      var headlineSection = document.getElementById('success-headline-section');
      var illustrationWrap = document.getElementById('success-illustration-wrap');
      var emailCard = document.getElementById('success-email-card');
      var offersBtn = document.getElementById('success-offers-btn');
      var vehicleCard = document.getElementById('av-vehicle-card');
      var existingPhotosBtn = document.getElementById('success-photos-btn');
      if (existingPhotosBtn) existingPhotosBtn.remove();

      if (vehicleCard) vehicleCard.style.display = '';
      // prod Review.vue: h1 -> subtitle -> status badge -> figure
      leftCol.insertBefore(illustrationWrap, headlineSection.nextSibling);
      if (def.illustration) {
        illustrationWrap.style.display = '';
        document.getElementById('success-illustration').src = def.illustration;
      } else {
        // No matching asset exists in this prototype — hide rather than show a mismatched image.
        illustrationWrap.style.display = 'none';
      }

      document.getElementById('success-headline').textContent = def.headline;
      document.getElementById('success-subtext').textContent = def.timingVariant ? reviewTimingText(copyVariant) : def.subtext;

      setBadge(def.badge);
      renderSteps(def.steps);
      setNotice(def.notice || null);
      setActionCard(def.actionCard || null);

      emailCard.style.display = def.emailCard ? 'flex' : 'none';
      if (def.emailCard) {
        var userEmail = (getStore().contact || {}).sahkoposti || 'esimerkki@email.fi';
        document.getElementById('success-email-address').textContent = userEmail;
        document.getElementById('success-email-card-title').textContent = t('success.emailCardTitle');
        document.getElementById('success-email-card-body').textContent = t('success.emailCardBody');
        document.getElementById('success-email-card-no-email').textContent = t('success.emailCardNoEmail');
        document.getElementById('success-email-resend').textContent = t('success.emailCardResend');
      }

      // Standalone blue button retired — in-review-verified now uses the notice's text link,
      // which carries the review-call copy variant through to offers.html.
      offersBtn.style.display = 'none';
      if (id === 'in-review-verified') {
        document.getElementById('success-notice-cta').href =
          'offers.html?scenario=draft-in-review&copy=' + (copyVariant || 'default');
      }
      return true;
    }

    function updateContent() {
      if (FORCED_SCENARIO && renderForcedScenario(FORCED_SCENARIO, FORCED_COPY)) return;
      const s = getStore();
      const photosOk = photosComplete(s);
      const emailVerified = !!s.emailVerified;
      const existing = document.getElementById('success-photos-btn');
      const leftCol = document.getElementById('success-illustration-wrap').parentNode;
      const headlineSection = document.getElementById('success-headline-section');
      const illustrationWrap = document.getElementById('success-illustration-wrap');
      const emailCard = document.getElementById('success-email-card');

      var offersBtn = document.getElementById('success-offers-btn');

      var vehicleCard = document.getElementById('av-vehicle-card');
      if (!photosOk) {
        // ── PHOTOS MISSING ──
        setNotice(null); setActionCard(null);
        if (vehicleCard) vehicleCard.style.display = '';
        if (offersBtn) offersBtn.style.display = 'none';
        leftCol.insertBefore(illustrationWrap, headlineSection); // illustration above headline
        document.getElementById('success-illustration').src = 'assets/success-photos-missing.png';
        document.getElementById('success-headline').textContent = t('success.headlineMissingPhotos');
        document.getElementById('success-subtext').textContent  = t('success.subtextMissingPhotos');
        document.getElementById('success-badge').style.display  = 'none';
        emailCard.style.display = 'none';
        document.getElementById('success-step4-row').style.display = 'none';
        document.getElementById('success-step5-row').style.display = 'none';
        document.getElementById('step1-title').textContent = t('success.missingStep1Title');
        document.getElementById('step1-body').textContent  = t('success.missingStep1Body');
        document.getElementById('step2-title').textContent = t('success.missingStep2Title');
        document.getElementById('step2-body').textContent  = t('success.missingStep2Body');
        document.getElementById('step3-title').textContent = t('success.missingStep3Title');
        document.getElementById('step3-body').textContent  = t('success.missingStep3Body');
        if (!existing) {
          const btn = document.createElement('a');
          btn.id = 'success-photos-btn';
          btn.href = 'photos.html?from=success';
          btn.style.cssText = 'display:flex;align-items:center;justify-content:center;background:#0B6DFF;border-radius:.5rem;height:3.5rem;padding:0 2rem;text-decoration:none;align-self:stretch;margin-top:.5rem;box-shadow:inset 0px 1px 2px 1px rgba(255,255,255,0.2);';
          btn.innerHTML = '<span style="font-family:\'DM Sans\',sans-serif;font-weight:500;font-size:1rem;color:white;">' + t('success.addPhotosBtn') + '</span>';
          document.getElementById('success-subtext').insertAdjacentElement('afterend', btn);
        }

      } else if (emailVerified) {
        // ── EMAIL VERIFIED ── same state as scenario 'in-review-verified': render via the
        // shared definition so the two paths cannot drift apart.
        existing?.remove();
        hideEmailToast();
        renderForcedScenario('in-review-verified', null);
        return;


      } else {
        // ── EMAIL NOT YET VERIFIED ── same state as scenario 'in-review-unverified'.
        existing?.remove();
        renderForcedScenario('in-review-unverified', null);
        showEmailToast();
        return;
      }
    }

    // Handle emailVerified URL param (landing from virtual email CTA)
    (function () {
      const p = new URLSearchParams(window.location.search);
      if (p.get('emailVerified') === '1') {
        const s = getStore();
        if (isDacUser(s) && !s.dac7Completed) {
          // Previous seller: collect DAC7 details before verified treatment
          window.location.replace('dac7.html');
          return;
        }
        s.emailVerified = true;
        setStore(s);
        // Clean the URL without reloading
        history.replaceState(null, '', window.location.pathname);
      }
    }());

    // Handle postMessage from iframe (virtual mobile device verify button)
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'emailVerified') return;
      const s = getStore();
      if (isDacUser(s) && !s.dac7Completed) {
        // Previous seller: collect DAC7 details before verified treatment
        window.location.href = 'dac7.html';
        return;
      }
      s.emailVerified = true;
      setStore(s);
      if (typeof window.muwCloseFrame === 'function') window.muwCloseFrame(false);
      updateContent();
      renderVehicleCard('av-vehicle-card', { successView: true });
    });

    document.addEventListener('DOMContentLoaded', function () {
      const s = getStore();
      s.successVisited = true;
      setStore(s);
      updateContent();
      renderVehicleCard('av-vehicle-card', { successView: true });

      document.getElementById('success-email-resend').addEventListener('click', function () {
        showEmailToast();
      });

      document.getElementById('email-toast-close').addEventListener('click', function () {
        var toast = document.getElementById('email-toast');
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(16px)';
        setTimeout(function () { toast.style.display = 'none'; }, 350);
      });

      document.getElementById('email-toast-view').addEventListener('click', function () {
        if (typeof window.muwOpenVerifyFrame === 'function') window.muwOpenVerifyFrame();
      });
    });

    window.addEventListener('pageshow', function (e) {
      if (e.persisted) { updateContent(); renderVehicleCard('av-vehicle-card', { successView: true }); }
    });

    var emailToastTimer = null;

    function hideEmailToast() {
      if (emailToastTimer) { clearTimeout(emailToastTimer); emailToastTimer = null; }
      var toast = document.getElementById('email-toast');
      if (!toast) return;
      toast.style.animation = 'none';
      toast.style.opacity = '0';
      toast.style.display = 'none';
    }

    function showEmailToast() {
      var toast = document.getElementById('email-toast');
      if (!toast) return;
      if (emailToastTimer) { clearTimeout(emailToastTimer); emailToastTimer = null; }
      // Reset
      toast.style.animation = 'none';
      toast.style.opacity = '0';
      toast.style.display = 'none';
      emailToastTimer = setTimeout(function () {
        emailToastTimer = null;
        // Apply current language
        var titleEl = document.getElementById('email-toast-title');
        var nowEl   = document.getElementById('email-toast-now');
        var viewEl  = document.getElementById('email-toast-view');
        if (titleEl) titleEl.textContent = t('success.emailToastTitle');
        if (nowEl)   nowEl.textContent   = t('success.emailToastNow');
        if (viewEl)  viewEl.textContent  = t('success.emailToastView');
        toast.style.display = 'flex';
        toast.offsetHeight; // force reflow
        toast.style.opacity = '';
        toast.style.animation = 'toastIn 0.55s cubic-bezier(0.34,1.56,0.64,1) forwards';
        // Attention pulse after entry settles
        emailToastTimer = setTimeout(function() {
          emailToastTimer = null;
          toast.style.animation = 'toastPulse 0.7s ease-in-out';
        }, 620);
      }, 1200);
    }

    // ── Floating "Scenario" selector — forces one of prod's 6 real draftStatus branches.
    // No footer exists on this page, so it's a fixed bottom-right control (same drawer
    // pattern as offers.html's footer-anchored one). ──
    (function () {
      var ROWS = [
        { id: null, label: 'Live simulation (photos/email)' },
        { id: 'rejected', label: 'Rejected' },
        { id: 'rejected-missing-images', label: 'Rejected — missing photos' },
        { id: 'in-review-unverified', label: 'In review — email not verified' },
        { id: 'in-review-verified', label: 'In review — email verified', variants: true },
        { id: 'queued', label: 'Queued — email not verified' },
        { id: 'published', label: 'Published (auction live)' },
      ];

      var wrap = document.createElement('div');
      wrap.style.cssText = 'position:fixed;bottom:16px;right:16px;z-index:9999;font-family:system-ui,sans-serif;';

      var toggle = document.createElement('button');
      toggle.style.cssText = 'background:#0B6DFF;color:#fff;border:none;border-radius:20px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2);';
      toggle.textContent = 'Scenario';

      var drawer = document.createElement('div');
      drawer.style.cssText = 'display:none;position:absolute;bottom:calc(100% + 8px);right:0;background:#fff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15);min-width:280px;max-height:420px;overflow-y:auto;padding:8px 0;';

      ROWS.forEach(function (row) {
        var cur = row.id === null ? !FORCED_SCENARIO : FORCED_SCENARIO === row.id;
        var container = document.createElement('div');
        container.style.cssText = 'display:flex;align-items:center;padding:7px 14px;font-size:12px;color:' + (cur ? '#0B6DFF' : '#334155') + ';background:' + (cur ? '#EEF6FA' : 'transparent') + ';font-weight:' + (cur ? '700' : '400') + ';gap:6px;';
        container.innerHTML = cur ? '<svg width="8" height="8" viewBox="0 0 8 8" fill="#0B6DFF"><circle cx="4" cy="4" r="4"/></svg>' : '<span style="width:8px;display:inline-block"></span>';

        var main = document.createElement('a');
        main.href = row.id ? ('success.html?scenario=' + row.id + (row.variants ? '&copy=default' : '')) : 'success.html';
        main.style.cssText = 'text-decoration:none;color:inherit;';
        main.textContent = row.label;
        container.appendChild(main);

        if (row.variants) {
          var variants = document.createElement('span');
          variants.style.cssText = 'color:#94a3b8;';
          variants.appendChild(document.createTextNode(' ('));
          [['default', '1'], ['soon', '2'], ['tomorrow', '3'], ['next_work_day', '4']].forEach(function (pair, vi) {
            if (vi > 0) variants.appendChild(document.createTextNode(','));
            var vActive = cur && (pair[0] === 'default' ? !FORCED_COPY : FORCED_COPY === pair[0]);
            var vLink = document.createElement('a');
            vLink.href = 'success.html?scenario=' + row.id + '&copy=' + pair[0];
            vLink.title = pair[0].replace(/_/g, ' ');
            vLink.style.cssText = 'text-decoration:underline;color:' + (vActive ? '#0B6DFF' : '#94a3b8') + ';font-weight:' + (vActive ? '700' : '400') + ';';
            vLink.textContent = pair[1];
            variants.appendChild(vLink);
          });
          variants.appendChild(document.createTextNode(')'));
          container.appendChild(variants);
        }

        container.addEventListener('mouseover', function () { if (!cur) container.style.background = '#f8fafc'; });
        container.addEventListener('mouseout', function () { if (!cur) container.style.background = 'transparent'; });

        drawer.appendChild(container);
      });

      var open = false;
      toggle.addEventListener('click', function () { open = !open; drawer.style.display = open ? 'block' : 'none'; });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && open) { open = false; drawer.style.display = 'none'; } });
      document.addEventListener('click', function (e) { if (open && !wrap.contains(e.target)) { open = false; drawer.style.display = 'none'; } });

      wrap.appendChild(drawer);
      wrap.appendChild(toggle);
      document.body.appendChild(wrap);
    })();
  </script>

  <style>
    @keyframes toastIn {
      0%   { opacity:0; transform:translateY(56px) scale(0.88); }
      60%  { opacity:1; transform:translateY(-8px) scale(1.03); }
      80%  { transform:translateY(4px) scale(0.99); }
      100% { opacity:1; transform:translateY(0) scale(1); }
    }
    @keyframes toastPulse {
      0%   { transform:scale(1);     box-shadow:0 16px 56px rgba(0,0,0,0.20),0 4px 16px rgba(0,0,0,0.10),0 0 0 1.5px rgba(11,109,255,0.12); }
      45%  { transform:scale(1.03);  box-shadow:0 20px 64px rgba(11,109,255,0.28),0 6px 24px rgba(11,109,255,0.18),0 0 0 2px rgba(11,109,255,0.40); }
      100% { transform:scale(1);     box-shadow:0 16px 56px rgba(0,0,0,0.20),0 4px 16px rgba(0,0,0,0.10),0 0 0 1.5px rgba(11,109,255,0.12); }
    }
  </style>

  <!-- OS-style email notification toast -->
  <div id="email-toast" style="
    position:fixed;bottom:24px;right:24px;z-index:8000;
    width:320px;max-width:calc(100vw - 32px);
    background:rgba(255,255,255,0.97);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border-radius:16px;
    box-shadow:0 16px 56px rgba(0,0,0,0.20),0 4px 16px rgba(0,0,0,0.10),0 0 0 1.5px rgba(11,109,255,0.12);
    padding:14px 14px 14px 16px;
    display:none;flex-direction:column;gap:5px;
    opacity:0;
    font-family:'DM Sans',sans-serif;">
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="width:32px;height:32px;background:#0B6DFF;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;">
        <svg width="16" height="13" viewBox="0 0 16 13" fill="none"><rect x="0.75" y="0.75" width="14.5" height="11.5" rx="2.25" stroke="white" stroke-width="1.5"/><path d="M1 2.5l7 4.5 7-4.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span style="font-size:13px;font-weight:700;color:#020617;flex:1;letter-spacing:-0.01em;">AutoVex</span>
      <span id="email-toast-now" style="font-size:12px;color:#94a3b8;">nyt</span>
      <button id="email-toast-close" aria-label="Sulje" style="background:none;border:none;padding:0;cursor:pointer;color:#94a3b8;margin-left:4px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p id="email-toast-title" style="font-size:14px;font-weight:600;color:#020617;margin:0 0 0 40px;line-height:1.4;">Sinulla on 1 uusi sähköposti</p>
    <button id="email-toast-view" style="display:flex;align-items:center;gap:4px;margin:0 0 0 40px;background:none;border:none;padding:0;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:#0B6DFF;">
      Näytä sähköposti
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6h8M6 2l4 4-4 4" stroke="#0B6DFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <script src="mobile-upload-widget.js"></script>
  <script src="layout.js"></script>
</body>
