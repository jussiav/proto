<!DOCTYPE html>
<html lang="fi" class="bg-blue-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="login.resetPageTitle">Valitse uusi salasana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            blue: {
              DEFAULT: '#0B6DFF',
              50:  '#EEF6FA',
              100: '#D7EDFF',
              200: '#B9E0FF',
              300: '#88CFFF',
              400: '#50B2FF',
              500: '#2890FF',
              600: '#0B6DFF',
              700: '#0A59EB',
              800: '#0F47BE',
              900: '#134195',
              950: '#11285A',
            },
            'av-blue':      '#0B6DFF',
            'av-blue-dark': '#0050C8',
            'av-dark':      '#08234D',
            'av-turquoise': '#00F0DC',
            'av-sky':       '#DAF0F5',
            'av-peach':     '#F5AB84',
            'av-cream':     '#FAEADA',
          },
          fontFamily: {
            display: ['Barlow', 'ui-sans-serif', 'system-ui', 'sans-serif', '"Apple Color Emoji"', '"Segoe UI Emoji"', '"Segoe UI Symbol"', '"Noto Color Emoji"'],
            body:    ['"DM Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif', '"Apple Color Emoji"', '"Segoe UI Emoji"', '"Segoe UI Symbol"', '"Noto Color Emoji"'],
          },
        }
      }
    }
  </script>
  <script src="tw-tokens.js"></script>
  <script src="translations.js"></script>
  <script src="i18n.js"></script>
  <script src="proto-mode.js"></script>
  <script src="proto-mock.js"></script>
  <script>
    /* Guest-only in prod, like /login. */
    try { if ((JSON.parse(localStorage.getItem('autovex_funnel') || '{}') || {}).loggedIn) location.replace('offers.html'); } catch (e) {}
  </script>
  <style>
    .required:after { content: ' *'; color: #ef4444; }
    .av-msg { background-color: rgb(11 109 255 / .1); border-color: #0B6DFF; }
    .av-msg--error { background-color: rgb(239 68 68 / .1); border-color: #EF4444; }
    .av-msg--error .av-msg-icon { color: #EF4444; }
  </style>
</head>
<body class="font-body bg-blue-50">

  <!-- resources/views/auth/passwords/reset.blade.php, then
       pages/reset-password/index.vue. -->
  <div class="min-h-screen sm:bg-[#FAEADA]">
    <div class="flex flex-col min-h-dvh">
      <div id="site-nav"></div>
      <script src="site-nav.js"></script>
      <main class="flex-1 w-full flex justify-center items-center">
        <div class="max-w-lg w-full my-8 p-8 md:p-12 lg:p-16 sm:rounded-2xl sm:shadow-md bg-white">
          <header class="mb-8 sm:text-center">
            <h2 class="text-5xl" data-i18n="login.resetTitle">Valitse uusi salasana</h2>
            <p id="reset-account" class="mt-2 text-base text-slate-600" style="display:none"></p>
          </header>
          <div id="reset-body"></div>
        </div>
      </main>
      <div id="site-footer"></div>
    </div>
  </div>

  <script src="app-footer.js"></script>
  <script>
  (function () {
    var STORE_KEY = 'autovex_funnel';
    var HANDOFF_KEY = 'autovex_auth_handoff';
    function getStore() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { return {}; } }
    function setStore(d) { try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch (e) {} }
    function el(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function T(key) { return window.t ? window.t(key) : key; }

    var token = new URLSearchParams(window.location.search).get('token') || '';
    function resetRecord() {
      var r = (getStore().auth || {}).reset;
      return r && r.token === token && !r.used && Date.now() < r.expires ? r : null;
    }
    /* ResetPasswordApiController::maskEmail: first letter, three dots, domain. */
    function mask(address) {
      var parts = String(address).split('@');
      return parts[0].slice(0, 1) + '•••@' + (parts[1] || '');
    }

    var WARN = '<svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm-8-80V80a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,172Z"/></svg>';
    function msgHtml(msg) {
      var body = Array.isArray(msg) ? '<div>' + msg.map(function (m) { return '<div>' + m + '</div>'; }).join('') + '</div>' : '<div>' + msg + '</div>';
      return '<div class="av-msg av-msg--error mb-4 flex items-start p-2 rounded-md border">' +
        '<div class="mr-1 w-6 h-6 flex items-center align-center"><i class="av-msg-icon flex items-center">' + WARN + '</i></div>' + body + '</div>';
    }
    /* elements/Button.vue, blue, medium: its pt-13px / pb-15px win over the
       size's py-2. */
    var LEGACY_BTN = 'pt-[13px] px-5 pb-[15px] inline-block leading-none font-medium rounded-lg transition transform tracking-wider cursor-pointer disabled:cursor-not-allowed bg-blue hover:bg-blue-600 text-white border-2 border-blue ring-blue text-base w-full mt-4';
    var INPUT = 'text-base font-normal block w-full border rounded px-4 py-3.5 transition focus:outline-none focus:ring appearance-none';
    var LABEL = 'mb-2 inline-block text-base leading-none lg:text-lg lg:leading-none required';

    var errors = null;
    var form = { password: '', password_confirmation: '' };
    var record = resetRecord();
    /* The context request on mount: an unknown, used or expired token answers
       404 and the page says so; otherwise the masked address shows. */
    var tokenInvalid = !record;
    if (record) {
      el('reset-account').textContent = T('login.resetForAccount').replace('{email}', mask(record.email));
      el('reset-account').style.display = 'block';
    }

    function field(name, labelKey, autofocus) {
      return '<div class="w-full px-2 mb-4"><label><span class="' + LABEL + '">' + esc(T(labelKey)) + '</span>' +
        '<input data-field="' + name + '" type="password" class="' + INPUT + ' ' + (errors ? 'border-red-500 bg-red-500 bg-opacity-10' : 'border-slate-800 bg-white') + '" required' + (autofocus ? ' autofocus' : '') + ' autocomplete="off" data-1p-ignore data-lpignore="true" data-bwignore="true" data-form-type="other"></label></div>';
    }
    function render() {
      var body = el('reset-body');
      if (tokenInvalid) {
        body.innerHTML = msgHtml(T('login.resetInvalidToken')) +
          '<button type="button" id="reset-new-link" class="' + LEGACY_BTN + '">' + esc(T('login.resetRequestNewLink')) + '</button>';
        el('reset-new-link').addEventListener('click', function () {
          try { sessionStorage.setItem(HANDOFF_KEY, JSON.stringify({ page: 'forgotPassword' })); } catch (e) {}
          location.href = 'login.html';
        });
        return;
      }
      /* Password managers are told to ignore the form, so the proto is not
         offered as a login to save; prod's new-password hint goes with it. */
      body.innerHTML = '<form id="reset-form" autocomplete="off" data-1p-ignore data-lpignore="true" data-form-type="other">' +
          (errors ? Object.keys(errors).map(function (k) { return msgHtml(errors[k]); }).join('') : '') +
          '<div class="flex flex-row flex-wrap -mx-2">' +
            field('password', 'login.password', true) +
            field('password_confirmation', 'login.passwordConfirmation', false) +
          '</div>' +
          '<button type="submit" class="' + LEGACY_BTN + '">' + esc(T('login.resetSubmit')) + '</button>' +
        '</form>';
      Array.prototype.forEach.call(body.querySelectorAll('[data-field]'), function (inp) {
        inp.value = form[inp.dataset.field];
        inp.addEventListener('input', function () {
          form[inp.dataset.field] = inp.value;
          if (errors) { errors = null; render(); body.querySelector('[data-field="' + inp.dataset.field + '"]').focus(); }
        });
      });
      el('reset-form').addEventListener('submit', function (e) { e.preventDefault(); submit(); });
    }

    /* POST /reset-password: the broker checks the token, then the password
       rules (Fortify's Password, 8 characters, and confirmed). */
    function submit() {
      var r = resetRecord();
      if (!r) { errors = { email: ['Resetointitunniste on viallinen.'] }; return render(); }
      var pw = [];
      if (form.password.length < 8) pw.push('Salasana: n on oltava vähintään 8 merkkiä.');
      if (form.password !== form.password_confirmation) pw.push('Kentän Salasana vahvistus ei täsmää.');
      if (pw.length) { errors = { password: pw }; return render(); }
      var s = getStore();
      s.auth.reset.used = true;
      s.account = s.account || {};
      s.account.hasPassword = true;
      setStore(s);
      /* The response carries the address, which goes to the login page's
         password step in memory, never in the URL. */
      try { sessionStorage.setItem(HANDOFF_KEY, JSON.stringify({ email: r.email, page: 'passwordLogin' })); } catch (e) {}
      location.href = 'login.html';
    }

    render();
    /* The password field's autofocus only fires on markup present at load. */
    var first = document.querySelector('[data-field="password"]');
    if (first) first.focus();
    document.addEventListener('av:langchange', render);

    window.protoPage = {
      actionSections: [
        { label: 'Password reset', actions: [
          { label: 'Open a valid link for the seller', title: 'As if the reset email had just been sent', run: function () {
            var s = getStore();
            var address = (s.contact || {}).sahkoposti || 'matti.meikalainen@example.fi';
            var t = Array.from({ length: 4 }, function () { return Math.random().toString(16).slice(2, 10); }).join('');
            s.auth = s.auth || {};
            s.auth.reset = { token: t, email: address, sent: Date.now(), expires: Date.now() + 60 * 60000, used: false };
            setStore(s);
            location.href = 'reset-password.html?token=' + encodeURIComponent(t);
          } }
        ] }
      ]
    };
  })();
  </script>
  <script src="proto-bar.js"></script>
</body>
</html>
